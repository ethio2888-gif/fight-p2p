<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fight P2P - ውጤት ማስገባት (Settle Bets)</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%); color: #ffffff; min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .user-bar { background: linear-gradient(135deg, #16213e 0%, #0f3460 100%); padding: 15px 25px; border-radius: 10px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; border: 2px solid #e94560; }
        .user-info { font-size: 1.1em; font-weight: bold; }
        .user-info span { color: #4ecca3; font-weight: bold; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.9em; text-decoration: none; display: inline-block; transition: all 0.3s; }
        .btn-home { background: linear-gradient(135deg, #4ecca3 0%, #3fa890 100%); color: #0f0f1a; }
        .btn-logout { background: linear-gradient(135deg, #e94560 0%, #c73650 100%); color: white; }
        header { text-align: center; padding: 30px 0; border-bottom: 3px solid #ffd700; margin-bottom: 30px; }
        h1 { font-size: 2.2em; color: #ffd700; text-transform: uppercase; letter-spacing: 2px; }
        .bet-card { background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%); border: 2px solid #ffd700; border-radius: 15px; padding: 25px; margin-bottom: 25px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3); }
        .bet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .bet-creator { color: #4ecca3; font-weight: bold; font-size: 1.1em; }
        .bet-details { display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 1.1em; flex-wrap: wrap; gap: 10px; }
        .bet-amount { color: #ffd700; font-weight: bold; }
        .bet-fighter { color: #ff0000; font-weight: bold; }
        .settle-buttons { display: flex; gap: 15px; }
        .btn-red { background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%); color: white; flex: 1; }
        .btn-blue { background: linear-gradient(135deg, #0000ff 0%, #0000cc 100%); color: white; flex: 1; }
        .btn-red:hover, .btn-blue:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4); }
        .message { margin-top: 15px; padding: 10px; border-radius: 6px; display: none; text-align: center; font-weight: bold; }
        .message.success { background-color: rgba(78, 204, 163, 0.2); color: #4ecca3; border: 1px solid #4ecca3; }
        .message.error { background-color: rgba(233, 69, 96, 0.2); color: #e94560; border: 1px solid #e94560; }
        .empty-state { text-align: center; padding: 40px; color: #888; font-size: 1.2em; background: #1a1a1a; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="user-bar">
            <div class="user-info" id="userInfo">Loading...</div>
            <div id="authButtons"></div>
        </div>

        <header>
            <h1>🏆 ውጤት ማስገባት (Settle Matched Bets)</h1>
            <p style="color: #888;">የተጣመሩ ውርርዶችን ውጤት ያስገቡ እና አሸናፊውን ይክፈሉ!</p>
        </header>

        <div id="bets-container">
            <div class="empty-state">⏳ ውርርዶችን እያመጣን ነው...</div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const username = localStorage.getItem('username');
        let userPoints = parseInt(localStorage.getItem('balance')) || 0;

        if (!token || !username) {
            alert('እባክዎ መጀመሪያ ይግቡ!');
            window.location.href = '/login.html';
        } else {
            document.getElementById('userInfo').innerHTML = `Welcome, <span>${username}</span>! | Balance: <span>${userPoints}</span> Points`;
            document.getElementById('authButtons').innerHTML = `
                <a href="/" class="btn btn-home" style="margin-right: 10px;">ዋና ገጽ</a>
                <button class="btn btn-logout" onclick="logout()">Logout</button>
            `;
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/login.html';
        }

        async function loadMatchedBets() {
            try {
                const response = await fetch('https://fight-p2p.onrender.com/api/bets/my-bets', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const bets = await response.json();
                
                // "Matched" ሁኔታ ላይ ያሉ ውርርዶችን ብቻ ማጣራት
                const matchedBets = bets.filter(bet => bet.status === 'matched');
                displayBets(matchedBets);
            } catch (error) {
                console.error('Error loading bets:', error);
                document.getElementById('bets-container').innerHTML = '<div class="empty-state">❌ ውርርዶችን ማምጣት አልተሳካም።</div>';
            }
        }

        function displayBets(bets) {
            const container = document.getElementById('bets-container');
            
            if (bets.length === 0) {
                container.innerHTML = '<div class="empty-state">📭 አሁን ላይ ምንም ሊፈቱ የሚገባቸው (Matched) ውርርዶች የሉም።</div>';
                return;
            }

            container.innerHTML = '';
            bets.forEach(bet => {
                const card = document.createElement('div');
                card.className = 'bet-card';
                
                const fighterText = bet.fighterChoice === 'red' ? '🔴 Red Corner' : '🔵 Blue Corner';
                const creatorName = bet.creator ? bet.creator.username : 'Unknown';
                const acceptorName = bet.acceptor ? bet.acceptor.username : 'Unknown';

                card.innerHTML = `
                    <div class="bet-header">
                        <span class="bet-creator">👤 ${creatorName} vs ${acceptorName}</span>
                        <span style="color: #ffd700; font-weight: bold;">MATCHED</span>
                    </div>
                    <div class="bet-details">
                        <span>ውርርድ መጠን: <span class="bet-amount">${bet.amount} Points</span> (እያንዳንዳቸው)</span>
                        <span>የተፈጠረበት ምርጫ: <span class="bet-fighter">${fighterText}</span></span>
                    </div>
                    <div class="settle-buttons">
                        <button class="btn btn-red" onclick="settleBet('${bet._id}', 'red', 'msg-${bet._id}')">🔴 Red አሸነፈ</button>
                        <button class="btn btn-blue" onclick="settleBet('${bet._id}', 'blue', 'msg-${bet._id}')">🔵 Blue አሸነፈ</button>
                    </div>
                    <div id="msg-${bet._id}" class="message"></div>
                `;
                container.appendChild(card);
            });
        }

        async function settleBet(betId, winningFighter, messageId) {
            if (!confirm(`እርግጠኛ ነዎት? ${winningFighter === 'red' ? '🔴 Red' : '🔵 Blue'} አሸናፊ ሆኖ ይመዘገባል።`)) {
                return;
            }

            const messageDiv = document.getElementById(messageId);
            showMessage(messageDiv, 'success', '⏳ ውጤቱን እያስገባን ነው...');

            try {
                const response = await fetch(`https://fight-p2p.onrender.com/api/bets/settle/${betId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ winningFighter })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage(messageDiv, 'success', `✅ ውጤቱ ተመዝግቧል! አሸናፊው ${data.winnerNewBalance} ፖይንት አግኝቷል።`);
                    
                    // የራስን ሂሳብ ካዘመነ
                    if (data.winnerNewBalance && data.bet.winner) {
                        // (Optional: Refresh balance if current user is the winner)
                    }
                    
                    setTimeout(() => {
                        loadMatchedBets(); // ዝርዝሩን ማደስ
                    }, 2000);
                } else {
                    showMessage(messageDiv, 'error', '❌ ' + (data.message || 'ውጤቱን ማስገባት አልተሳካም'));
                }
            } catch (error) {
                console.error('Settle bet error:', error);
                showMessage(messageDiv, 'error', '❌ የኔትወርክ ስህተት። እባክዎ እንደገና ይሞክሩ።');
            }
        }

        function showMessage(element, type, text) {
            element.className = `message ${type}`;
            element.innerText = text;
            element.style.display = 'block';
            setTimeout(() => { element.style.display = 'none'; }, 5000);
        }

        loadMatchedBets();
    </script>
</body>
</html>
