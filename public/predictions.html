<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fight P2P - ክፍት ግምቶች</title>
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%); color: #ffffff; min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        
        /* 🆕 ቀላል እና ጽዳት ያለው የመመለሻ ቀስት (Back Arrow) */
        .back-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            color: #ffffff;
            text-decoration: none;
            font-size: 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(-4px);
        }

        .user-bar { background: linear-gradient(135deg, #16213e 0%, #0f3460 100%); padding: 15px 25px; border-radius: 10px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; border: 2px solid #e94560; flex-wrap: wrap; gap: 10px; }
        .user-info { font-size: 1.1em; font-weight: bold; }
        .user-info span { color: #4ecca3; font-weight: bold; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.9em; text-decoration: none; display: inline-block; transition: all 0.3s; }
        .btn-logout { background: linear-gradient(135deg, #e94560 0%, #c73650 100%); color: white; }
        .btn-accept { background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%); color: black; width: 100%; margin-top: 10px; font-size: 1.1em; }
        .btn-accept:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(255, 215, 0, 0.4); }
        .btn-accept:disabled { background: #333; color: #666; cursor: not-allowed; transform: none; box-shadow: none; }
        header { text-align: center; padding: 30px 0; border-bottom: 3px solid #ff0000; margin-bottom: 30px; }
        h1 { font-size: 2.2em; color: #ffd700; text-transform: uppercase; letter-spacing: 2px; }
        
        .prediction-card { background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%); border: 2px solid #333; border-radius: 15px; padding: 25px; margin-bottom: 25px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3); }
        .prediction-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .prediction-creator { color: #4ecca3; font-weight: bold; font-size: 1.1em; }
        .prediction-details { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 1.1em; flex-wrap: wrap; gap: 10px; }
        .prediction-amount { color: #ffd700; font-weight: bold; }
        .prediction-fighter { color: #ff0000; font-weight: bold; }
        
        .message { margin-top: 15px; padding: 10px; border-radius: 6px; display: none; text-align: center; font-weight: bold; }
        .message.success { background-color: rgba(78, 204, 163, 0.2); color: #4ecca3; border: 1px solid #4ecca3; }
        .message.error { background-color: rgba(233, 69, 96, 0.2); color: #e94560; border: 1px solid #e94560; }
        .empty-state { text-align: center; padding: 40px; color: #888; font-size: 1.2em; background: #1a1a1a; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 🆕 ቀላል የመመለሻ ቀስት (ወደ ዋና ገጽ ይመልሳል) -->
        <a href="/" class="back-btn" aria-label="Back to Home">←</a>

        <div class="user-bar">
            <div class="user-info" id="userInfo">Loading...</div>
            <div id="authButtons"></div>
        </div>

        <header>
            <h1>🔥 ክፍት ግምቶች (Open Predictions)</h1>
            <p style="color: #888;">ሌሎች ተጫዋቾች የፈጠሩትን ግምት ይመልከቱ እና ይቀበሉ!</p>
        </header>

        <div id="predictions-container">
            <div class="empty-state">⏳ ግምቶችን እያመጣን ነው...</div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const username = localStorage.getItem('username');
        let userPoints = parseInt(localStorage.getItem('balance')) || 0;

        if (!token || !username) {
            window.location.href = '/login.html';
        } else {
            // 🔒 SECURITY FIRST: Escape username to prevent XSS
            document.getElementById('userInfo').innerHTML = `Welcome, <span>${escapeHTML(username)}</span>! | Balance: <span>${userPoints}</span> Points`;
            document.getElementById('authButtons').innerHTML = `
                <button class="btn btn-logout" onclick="logout()">Logout</button>
            `;
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/login.html';
        }

        // 🔒 SECURITY FIRST: Prevent XSS by escaping HTML characters
        function escapeHTML(str) {
            if (str === null || str === undefined) return '';
            return String(str).replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        }

        async function loadOpenPredictions() {
            try {
                // 🚀 HIGH TRAFFIC: Relative URL ስለሆነ በማንኛውም ዶሜይን (Localhost/Production) ይሰራል
                const response = await fetch('/api/bets/open');
                const predictions = await response.json();
                displayPredictions(predictions);
            } catch (error) {
                console.error('Error loading predictions:', error);
                document.getElementById('predictions-container').innerHTML = '<div class="empty-state">❌ ግምቶችን ማምጣት አልተሳካም።</div>';
            }
        }

        function displayPredictions(predictions) {
            const container = document.getElementById('predictions-container');
            const availablePredictions = predictions.filter(pred => pred.creator && pred.creator.username !== username);

            if (availablePredictions.length === 0) {
                container.innerHTML = '<div class="empty-state">📭 አሁን ላይ ምንም ክፍት ግምቶች የሉም። ወደ ዋናው ገጽ ሄደው አዲስ ግምት ይፍጠሩ!</div>';
                return;
            }

            container.innerHTML = '';
            availablePredictions.forEach(pred => {
                const card = document.createElement('div');
                card.className = 'prediction-card';
                const fighterText = pred.fighterChoice === 'red' ? '🔴 Red Corner (Fighter 1)' : '🔵 Blue Corner (Fighter 2)';

                // 🔒 SECURITY FIRST: All dynamic content is escaped
                card.innerHTML = `
                    <div class="prediction-header">
                        <span class="prediction-creator">👤 ${escapeHTML(pred.creator.username)}</span>
                        <span style="color: #888; font-size: 0.9em;">${escapeHTML(new Date(pred.createdAt).toLocaleDateString())}</span>
                    </div>
                    <div class="prediction-details">
                        <span>የግምት መጠን: <span class="prediction-amount">${escapeHTML(pred.amount)} Points</span></span>
                        <span>ምርጫ: <span class="prediction-fighter">${escapeHTML(fighterText)}</span></span>
                    </div>
                    <button class="btn btn-accept" onclick="acceptPrediction('${escapeHTML(pred._id)}', ${pred.amount}, 'msg-${escapeHTML(pred._id)}')">
                        ይህንን ግምት ይቀበሉ (Accept Prediction)
                    </button>
                    <div id="msg-${escapeHTML(pred._id)}" class="message"></div>
                `;
                container.appendChild(card);
            });
        }

        async function acceptPrediction(predId, amount, messageId) {
            const messageDiv = document.getElementById(messageId);
            const btn = messageDiv.previousElementSibling; // The button
            
            if (userPoints < amount) {
                showMessage(messageDiv, 'error', '❌ በቂ ሂሳብ የለዎትም!');
                return;
            }

            // 🚀 HIGH TRAFFIC: Disable button to prevent double-clicks
            btn.disabled = true;
            btn.innerText = '⏳ እየሰራ ነው...';
            showMessage(messageDiv, 'success', '⏳ ግምቱን እየቀበልን ነው...');

            try {
                const response = await fetch(`/api/bets/accept/${predId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await response.json();

                if (response.ok) {
                    userPoints = data.newBalance || (userPoints - amount);
                    localStorage.setItem('balance', userPoints);
                    document.querySelector('.user-info').innerHTML = `Welcome, <span>${escapeHTML(username)}</span>! | Balance: <span>${userPoints}</span> Points`;
                    
                    showMessage(messageDiv, 'success', `✅ ግምቱ በተሳካ ሁኔታ ተቀብለዋል! ጨዋታው ተጣምሯል (Matched)!`);
                    
                    setTimeout(() => {
                        loadOpenPredictions();
                    }, 2000);
                } else {
                    showMessage(messageDiv, 'error', '❌ ' + (data.message || 'ግምቱን መቀበል አልተሳካም'));
                    // Re-enable button on error
                    btn.disabled = false;
                    btn.innerText = 'ይህንን ግምት ይቀበሉ (Accept Prediction)';
                }
            } catch (error) {
                console.error('Accept prediction error:', error);
                showMessage(messageDiv, 'error', '❌ የኔትወርክ ስህተት። እባክዎ እንደገና ይሞክሩ።');
                // Re-enable button on error
                btn.disabled = false;
                btn.innerText = 'ይህንን ግምት ይቀበሉ (Accept Prediction)';
            }
        }

        function showMessage(element, type, text) {
            element.className = `message ${type}`;
            element.innerText = text; // 🔒 Security: innerText prevents XSS
            element.style.display = 'block';
            setTimeout(() => { element.style.display = 'none'; }, 5000);
        }

        loadOpenPredictions();
    </script>
</body>
</html>
