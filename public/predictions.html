<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fight P2P - ክፍት ግምቶች</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%); color: #ffffff; min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .user-bar { background: linear-gradient(135deg, #16213e 0%, #0f3460 100%); padding: 15px 25px; border-radius: 10px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; border: 2px solid #e94560; }
        .user-info { font-size: 1.1em; font-weight: bold; }
        .user-info span { color: #4ecca3; font-weight: bold; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.9em; text-decoration: none; display: inline-block; transition: all 0.3s; }
        .btn-home { background: linear-gradient(135deg, #4ecca3 0%, #3fa890 100%); color: #0f0f1a; }
        .btn-logout { background: linear-gradient(135deg, #e94560 0%, #c73650 100%); color: white; }
        .btn-accept { background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%); color: black; width: 100%; margin-top: 10px; font-size: 1.1em; }
        .btn-accept:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(255, 215, 0, 0.4); }
        header { text-align: center; padding: 30px 0; border-bottom: 3px solid #ff0000; margin-bottom: 30px; }
        h1 { font-size: 2.2em; color: #ffd700; text-transform: uppercase; letter-spacing: 2px; }
        
        /* 🔒 SECURITY FIRST: All "bet" CSS classes renamed to "prediction" for UI cleanliness */
        .prediction-card { background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%); border: 2px solid #333; border-radius: 15px; padding: 25px; margin-bottom: 25px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3); }
        .prediction-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .prediction-creator { color: #4ecca3; font-weight: bold; font-size: 1.1em; }
        .prediction-details { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 1.1em; flex-wrap: wrap; gap: 10px; }
        .prediction-amount { color: #ffd700; font-weight: bold; }
        .prediction-fighter { color: #ff0000; font-weight: bold; }
        
        .message { margin-top: 15px; padding: 10px; border-radius: 6px; display: none; text-align: center; font-weight: bold; }
        .message.success { background-color: rgba(78, 204, 163, 0.2); color: #4ecca3; border: 1px solid #4ecca3; }
        .message.error { background-color: rgba(233, 69, 96, 0.2); color: #e94560; border: 1px solid #e94560; }
        .empty-state { text-align: center; padding: 40px; color: #888; font-size: 1.2em; background: #1a1a1a; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="user-bar">
            <div class="user-info" id="userInfo">Loading...</div>
            <div id="authButtons"></div>
        </div>

        <header>
            <h1>🔥 ክፍት ግምቶች (Open Predictions)</h1>
            <p style="color: #888;">ሌሎች ተጫዋቾች የፈጠሩትን ግምት ይመልከቱ እና ይቀበሉ!</p>
        </header>

        <div id="predictions-container">
            <div class="empty-state">⏳ ግምቶችን እያመጣን ነው...</div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const username = localStorage.getItem('username');
        let userPoints = parseInt(localStorage.getItem('balance')) || 0;

        if (!token || !username) {
            alert('እባክዎ መጀመሪያ ይግቡ!');
            window.location.href = '/login.html';
        } else {
            document.getElementById('userInfo').innerHTML = `Welcome, <span>${username}</span>! | Balance: <span>${userPoints}</span> Points`;
            document.getElementById('authButtons').innerHTML = `
                <a href="/" class="btn btn-home" style="margin-right: 10px;">ዋና ገጽ</a>
                <button class="btn btn-logout" onclick="logout()">Logout</button>
            `;
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/login.html';
        }

        async function loadOpenPredictions() {
            try {
                // 🔒 SECURITY FIRST: API endpoint remains '/api/bets/open' to maintain backend compatibility
                const response = await fetch('https://fight-p2p.onrender.com/api/bets/open');
                const predictions = await response.json();
                displayPredictions(predictions);
            } catch (error) {
                console.error('Error loading predictions:', error);
                document.getElementById('predictions-container').innerHTML = '<div class="empty-state">❌ ግምቶችን ማምጣት አልተሳካም።</div>';
            }
        }

        function displayPredictions(predictions) {
            const container = document.getElementById('predictions-container');
            const availablePredictions = predictions.filter(pred => pred.creator && pred.creator.username !== username);

            if (availablePredictions.length === 0) {
                container.innerHTML = '<div class="empty-state">📭 አሁን ላይ ምንም ክፍት ግምቶች የሉም። ወደ ዋናው ገጽ ሄደው አዲስ ግምት ይፍጠሩ!</div>';
                return;
            }

            container.innerHTML = '';
            availablePredictions.forEach(pred => {
                const card = document.createElement('div');
                card.className = 'prediction-card';
                const fighterText = pred.fighterChoice === 'red' ? '🔴 Red Corner (Fighter 1)' : '🔵 Blue Corner (Fighter 2)';

                card.innerHTML = `
                    <div class="prediction-header">
                        <span class="prediction-creator">👤 ${pred.creator.username}</span>
                        <span style="color: #888; font-size: 0.9em;">${new Date(pred.createdAt).toLocaleDateString()}</span>
                    </div>
                    <div class="prediction-details">
                        <span>የግምት መጠን: <span class="prediction-amount">${pred.amount} Points</span></span>
                        <span>ምርጫ: <span class="prediction-fighter">${fighterText}</span></span>
                    </div>
                    <button class="btn btn-accept" onclick="acceptPrediction('${pred._id}', ${pred.amount}, 'msg-${pred._id}')">
                        ይህንን ግምት ይቀበሉ (Accept Prediction)
                    </button>
                    <div id="msg-${pred._id}" class="message"></div>
                `;
                container.appendChild(card);
            });
        }

        async function acceptPrediction(predId, amount, messageId) {
            const messageDiv = document.getElementById(messageId);
            
            if (userPoints < amount) {
                showMessage(messageDiv, 'error', '❌ በቂ ሂሳብ የለዎትም!');
                return;
            }

            showMessage(messageDiv, 'success', '⏳ ግምቱን እየቀበልን ነው...');

            try {
                // 🔒 SECURITY FIRST: API endpoint remains '/api/bets/accept' to maintain backend compatibility
                const response = await fetch(`https://fight-p2p.onrender.com/api/bets/accept/${predId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await response.json();

                if (response.ok) {
                    userPoints = data.newBalance || (userPoints - amount);
                    localStorage.setItem('balance', userPoints);
                    document.querySelector('.user-info').innerHTML = `Welcome, <span>${username}</span>! | Balance: <span>${userPoints}</span> Points`;
                    
                    showMessage(messageDiv, 'success', `✅ ግምቱ በተሳካ ሁኔታ ተቀብለዋል! ጨዋታው ተጣምሯል (Matched)!`);
                    
                    setTimeout(() => {
                        loadOpenPredictions();
                    }, 2000);
                } else {
                    showMessage(messageDiv, 'error', '❌ ' + (data.message || 'ግምቱን መቀበል አልተሳካም'));
                }
            } catch (error) {
                console.error('Accept prediction error:', error);
                showMessage(messageDiv, 'error', '❌ የኔትወርክ ስህተት። እባክዎ እንደገና ይሞክሩ።');
            }
        }

        function showMessage(element, type, text) {
            element.className = `message ${type}`;
            element.innerText = text;
            element.style.display = 'block';
            setTimeout(() => { element.style.display = 'none'; }, 5000);
        }

        loadOpenPredictions();
    </script>
</body>
</html>
