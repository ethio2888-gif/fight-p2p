<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fight P2P - Leaderboard</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%); color: #ffffff; min-height: 100vh; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .user-bar { background: linear-gradient(135deg, #16213e 0%, #0f3460 100%); padding: 15px 25px; border-radius: 10px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; border: 2px solid #e94560; }
        .user-info { font-size: 1.1em; font-weight: bold; }
        .user-info span { color: #4ecca3; font-weight: bold; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.9em; text-decoration: none; display: inline-block; transition: all 0.3s; }
        .btn-home { background: linear-gradient(135deg, #4ecca3 0%, #3fa890 100%); color: #0f0f1a; }
        .btn-logout { background: linear-gradient(135deg, #e94560 0%, #c73650 100%); color: white; }
        header { text-align: center; padding: 30px 0; border-bottom: 3px solid #ffd700; margin-bottom: 30px; }
        h1 { font-size: 2.2em; color: #ffd700; text-transform: uppercase; letter-spacing: 2px; }
        
        .leaderboard-list { list-style: none; padding: 0; }
        .leaderboard-item {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            border: 1px solid #333;
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s, border-color 0.2s;
        }
        .leaderboard-item:hover { transform: translateX(5px); border-color: #ffd700; }
        
        .rank { font-size: 1.5em; font-weight: bold; width: 40px; text-align: center; }
        .rank-1 { color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); } /* Gold */
        .rank-2 { color: #c0c0c0; } /* Silver */
        .rank-3 { color: #cd7f32; } /* Bronze */
        
        .username { flex: 1; font-size: 1.1em; font-weight: bold; padding-left: 15px; }
        .balance { font-size: 1.1em; color: #4ecca3; font-weight: bold; }
        
        .empty-state { text-align: center; padding: 40px; color: #888; font-size: 1.2em; background: #1a1a1a; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="user-bar">
            <div class="user-info" id="userInfo">Loading...</div>
            <div id="authButtons"></div>
        </div>

        <header>
            <h1>🏆 Top Fighters</h1>
            <p style="color: #888;">ከፍተኛ ፖይንት ያሸነፉ ተጫዋቾች</p>
        </header>

        <ul id="leaderboard-list" class="leaderboard-list">
            <li class="empty-state">⏳ ውጤቶችን እያመጣን ነው...</li>
        </ul>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const username = localStorage.getItem('username');
        const userPoints = parseInt(localStorage.getItem('balance')) || 0;

        if (token && username) {
            document.getElementById('userInfo').innerHTML = `Welcome, <span>${username}</span>! | Balance: <span>${userPoints}</span> Points`;
            document.getElementById('authButtons').innerHTML = `
                <a href="/" class="btn btn-home" style="margin-right: 10px;">ዋና ገጽ</a>
                <button class="btn btn-logout" onclick="logout()">Logout</button>
            `;
        } else {
            document.getElementById('userInfo').innerHTML = `Welcome, Guest!`;
            document.getElementById('authButtons').innerHTML = `<a href="/login.html" class="btn btn-home">Login</a>`;
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/login.html';
        }

        async function loadLeaderboard() {
            try {
                const response = await fetch('https://fight-p2p.onrender.com/api/leaderboard');
                const users = await response.json();
                displayLeaderboard(users);
            } catch (error) {
                console.error('Error loading leaderboard:', error);
                document.getElementById('leaderboard-list').innerHTML = '<li class="empty-state">❌ ውጤቶችን ማምጣት አልተሳካም።</li>';
            }
        }

        function displayLeaderboard(users) {
            const list = document.getElementById('leaderboard-list');
            if (!users || users.length === 0) {
                list.innerHTML = '<li class="empty-state">📭 አሁን ላይ ምንም ውጤት የለም።</li>';
                return;
            }

            list.innerHTML = '';
            users.forEach((user, index) => {
                const rank = index + 1;
                let rankIcon = rank;
                let rankClass = '';
                
                if (rank === 1) { rankIcon = '🥇'; rankClass = 'rank-1'; }
                else if (rank === 2) { rankIcon = '🥈'; rankClass = 'rank-2'; }
                else if (rank === 3) { rankIcon = '🥉'; rankClass = 'rank-3'; }

                // ✅ Security & UX: የአሁኑን ተጠቃሚ ለይቶ ለማሳየት
                const isCurrentUser = user.username === username;
                const highlightStyle = isCurrentUser ? 'border: 2px solid #4ecca3; background: rgba(78, 204, 163, 0.1);' : '';

                const item = document.createElement('li');
                item.className = 'leaderboard-item';
                item.style = highlightStyle;
                
                // ✅ Security: textContent በመጠቀም XSS መከላከል
                const usernameSpan = document.createElement('span');
                usernameSpan.className = 'username';
                usernameSpan.textContent = user.username + (isCurrentUser ? ' (You)' : '');
                
                const balanceSpan = document.createElement('span');
                balanceSpan.className = 'balance';
                balanceSpan.textContent = user.balance.toLocaleString() + ' pts';

                const rankSpan = document.createElement('span');
                rankSpan.className = `rank ${rankClass}`;
                rankSpan.textContent = rankIcon;

                item.appendChild(rankSpan);
                item.appendChild(usernameSpan);
                item.appendChild(balanceSpan);
                
                list.appendChild(item);
            });
        }

        loadLeaderboard();
    </script>
</body>
</html>
