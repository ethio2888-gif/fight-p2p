<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fight P2P - Leaderboard</title>
    <style>
        /* --- Modern Reset & Base --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at 10% 20%, #1a1a2e 0%, #0f0f1a 90%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        .container { max-width: 700px; margin: 0 auto; }

        /* --- Glassmorphism Utility --- */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* --- User Bar --- */
        .user-bar {
            padding: 16px 24px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #e94560;
        }

        .user-info { font-size: 1.05em; font-weight: 600; color: #ffffff; }
        .user-info span { color: #4ecca3; font-weight: 700; }

        /* --- Buttons --- */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9em;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0,0,0,0.3); }
        .btn:active { transform: translateY(0); }

        .btn-home { background: linear-gradient(135deg, #4ecca3 0%, #3fa890 100%); color: #0f0f1a; }
        .btn-logout { background: linear-gradient(135deg, #e94560 0%, #c73650 100%); color: white; }

        /* --- Header --- */
        header { text-align: center; padding: 40px 0 30px; margin-bottom: 20px; }
        h1 {
            font-size: 2.5em;
            font-weight: 800;
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        header p { color: #888; font-size: 1.1em; font-weight: 400; }
        
        /* --- Leaderboard List --- */
        .leaderboard-list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 12px; }
        
        .leaderboard-item {
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }
        .leaderboard-item:hover { 
            transform: translateX(5px); 
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4); 
            border-color: rgba(255, 215, 0, 0.3); 
        }
        
        .rank { 
            font-size: 1.4em; 
            font-weight: 800; 
            width: 50px; 
            text-align: center; 
        }
        .rank-1 { color: #ffd700; text-shadow: 0 0 12px rgba(255, 215, 0, 0.4); } /* Gold */
        .rank-2 { color: #c0c0c0; text-shadow: 0 0 12px rgba(192, 192, 192, 0.3); } /* Silver */
        .rank-3 { color: #cd7f32; text-shadow: 0 0 12px rgba(205, 127, 50, 0.3); } /* Bronze */
        .rank-default { color: #666; }
        
        .username { 
            flex: 1; 
            font-size: 1.1em; 
            font-weight: 600; 
            padding-left: 15px; 
            color: #ffffff;
        }
        .balance { 
            font-size: 1.15em; 
            color: #4ecca3; 
            font-weight: 700; 
            letter-spacing: 0.5px;
        }
        
        .empty-state { 
            text-align: center; 
            padding: 50px 20px; 
            color: #888; 
            font-size: 1.1em; 
            background: rgba(255, 255, 255, 0.02); 
            border-radius: 16px; 
            border: 1px dashed rgba(255, 255, 255, 0.1); 
        }

        /* --- Responsive --- */
        @media (max-width: 600px) {
            .user-bar { flex-direction: column; gap: 15px; text-align: center; }
            .leaderboard-item { padding: 15px; }
            .username { font-size: 1em; }
            .balance { font-size: 1em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="user-bar glass-panel">
            <div class="user-info" id="userInfo">Loading...</div>
            <div id="authButtons"></div>
        </div>

        <header>
            <h1>🏆 Top Fighters</h1>
            <p>ከፍተኛ ፖይንት ያሸነፉ ተጫዋቾች</p>
        </header>

        <ul id="leaderboard-list" class="leaderboard-list">
            <li class="empty-state glass-panel">⏳ ውጤቶችን እያመጣን ነው...</li>
        </ul>
    </div>

    <script>
        // ==========================================
        // 🔒 SECURITY FIRST: All logic preserved exactly as before
        // ==========================================
        const token = localStorage.getItem('token');
        const username = localStorage.getItem('username');
        const userPoints = parseInt(localStorage.getItem('balance')) || 0;

        if (token && username) {
            document.getElementById('userInfo').innerHTML = `Welcome, <span>${username}</span>! | Balance: <span>${userPoints}</span> Points`;
            document.getElementById('authButtons').innerHTML = `
                <a href="/" class="btn btn-home" style="margin-right: 10px;">ዋና ገጽ</a>
                <button class="btn btn-logout" onclick="logout()">Logout</button>
            `;
        } else {
            document.getElementById('userInfo').innerHTML = `Welcome, Guest!`;
            document.getElementById('authButtons').innerHTML = `<a href="/login.html" class="btn btn-home">Login</a>`;
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/login.html';
        }

        async function loadLeaderboard() {
            try {
                const response = await fetch('https://fight-p2p.onrender.com/api/leaderboard');
                const users = await response.json();
                displayLeaderboard(users);
            } catch (error) {
                console.error('Error loading leaderboard:', error);
                document.getElementById('leaderboard-list').innerHTML = '<li class="empty-state glass-panel">❌ ውጤቶችን ማምጣት አልተሳካም።</li>';
            }
        }

        function displayLeaderboard(users) {
            const list = document.getElementById('leaderboard-list');
            if (!users || users.length === 0) {
                list.innerHTML = '<li class="empty-state glass-panel">📭 አሁን ላይ ምንም ውጤት የለም።</li>';
                return;
            }

            list.innerHTML = '';
            users.forEach((user, index) => {
                const rank = index + 1;
                let rankIcon = rank;
                let rankClass = 'rank-default';
                
                if (rank === 1) { rankIcon = '🥇'; rankClass = 'rank-1'; }
                else if (rank === 2) { rankIcon = '🥈'; rankClass = 'rank-2'; }
                else if (rank === 3) { rankIcon = '🥉'; rankClass = 'rank-3'; }

                // ✅ Security & UX: የአሁኑን ተጠቃሚ ለይቶ ለማሳየት
                const isCurrentUser = user.username === username;
                const highlightStyle = isCurrentUser ? 'border: 2px solid #4ecca3; background: rgba(78, 204, 163, 0.08);' : '';

                const item = document.createElement('li');
                item.className = 'leaderboard-item glass-panel';
                item.style = highlightStyle;
                
                // ✅ Security: textContent በመጠቀም XSS መከላከል
                const usernameSpan = document.createElement('span');
                usernameSpan.className = 'username';
                usernameSpan.textContent = user.username + (isCurrentUser ? ' (You)' : '');
                
                const balanceSpan = document.createElement('span');
                balanceSpan.className = 'balance';
                balanceSpan.textContent = user.balance.toLocaleString() + ' pts';

                const rankSpan = document.createElement('span');
                rankSpan.className = `rank ${rankClass}`;
                rankSpan.textContent = rankIcon;

                item.appendChild(rankSpan);
                item.appendChild(usernameSpan);
                item.appendChild(balanceSpan);
                
                list.appendChild(item);
            });
        }

        loadLeaderboard();
    </script>
</body>
</html>
