<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fight P2P - Boxing Betting Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* ========== የተጠቃሚ መረጃ ባር (User Bar) ========== */
        .user-bar {
            background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid #e94560;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .user-info {
            font-size: 1.1em;
            font-weight: bold;
        }

        .user-info span {
            color: #4ecca3;
            font-weight: bold;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9em;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
        }

        .btn-login {
            background: linear-gradient(135deg, #4ecca3 0%, #3fa890 100%);
            color: #0f0f1a;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(78, 204, 163, 0.4);
        }

        .btn-logout {
            background: linear-gradient(135deg, #e94560 0%, #c73650 100%);
            color: white;
        }

        .btn-logout:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(233, 69, 96, 0.4);
        }

        /* ========== የማስታወቂያ ባነር (Ad Banner) ========== */
        .ads-container {
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .ad-banner {
            width: 100%;
            max-width: 728px;
            min-height: 90px;
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            border: 1px solid #ffd700;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            text-decoration: none;
        }

        .ad-banner:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.3);
        }

        .ad-banner img {
            max-width: 100%;
            max-height: 150px;
            object-fit: contain;
        }

        .ad-label {
            position: absolute;
            top: 4px;
            right: 6px;
            font-size: 0.65em;
            color: #aaa;
            background: rgba(0, 0, 0, 0.6);
            padding: 2px 6px;
            border-radius: 3px;
            text-transform: uppercase;
        }

        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 3px solid #ff0000;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            color: #ffd700;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 2px 2px 4px rgba(255, 0, 0, 0.5);
        }

        .tagline {
            color: #ff0000;
            font-size: 1.2em;
            margin-top: 10px;
        }

        .user-balance {
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
            color: #000;
            padding: 15px 25px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .balance-amount {
            font-size: 2em;
            color: #ff0000;
        }

        .fights-section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 1.8em;
            color: #ffd700;
            margin-bottom: 20px;
            padding-left: 15px;
            border-left: 4px solid #ff0000;
        }

        .fight-card {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            border: 2px solid #333;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .fight-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .fight-date {
            background: #ff0000;
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: bold;
        }

        .fighters {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .fighter {
            text-align: center;
            flex: 1;
            min-width: 120px;
            padding: 15px;
        }

        .fighter-photo {
            font-size: 4em;
            margin-bottom: 10px;
        }

        .fighter-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 5px;
        }

        .fighter-record {
            color: #888;
            font-size: 0.9em;
        }

        .vs {
            font-size: 2em;
            font-weight: bold;
            color: #ff0000;
            padding: 0 20px;
            text-shadow: 2px 2px 4px rgba(255, 0, 0, 0.8);
        }

        .betting-section {
            background: #0a0a0a;
            padding: 20px;
            border-radius: 10px;
            margin-top: 15px;
        }

        /* ✅ አዲስ: የውርርድ መጠን መምረጫ ዲዛይን */
        .bet-amount-selector { 
            margin-bottom: 15px; 
            text-align: center; 
            background: #1a1a1a; 
            padding: 15px; 
            border-radius: 8px; 
            border: 1px solid #333; 
        }
        .quick-bet-btn { 
            background: #333; 
            color: #ffd700; 
            border: 1px solid #ffd700; 
            padding: 8px 15px; 
            border-radius: 5px; 
            cursor: pointer; 
            font-weight: bold; 
            transition: all 0.2s; 
            margin: 3px; 
        }
        .quick-bet-btn:hover { 
            background: #ffd700; 
            color: #000; 
        }
        .custom-bet-input { 
            width: 100%; 
            max-width: 250px; 
            padding: 10px; 
            border-radius: 5px; 
            border: 1px solid #ffd700; 
            background: #0a0a0a; 
            color: #fff; 
            text-align: center; 
            font-size: 1.1em; 
            font-weight: bold; 
            margin-top: 10px; 
        }
        .custom-bet-input:focus { 
            outline: none; 
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.5); 
        }

        .bet-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .bet-btn {
            flex: 1;
            min-width: 150px;
            padding: 15px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .bet-btn-fighter1 {
            background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);
            color: white;
        }

        .bet-btn-fighter2 {
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
            color: black;
        }

        .bet-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
        }

        .bet-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .bet-btn:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .current-bets {
            margin-top: 15px;
            padding: 15px;
            background: #1a1a1a;
            border-radius: 8px;
        }

        .bet-item {
            padding: 10px;
            margin: 5px 0;
            background: #2a2a2a;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-upcoming {
            color: #00ff00;
        }

        .status-live {
            color: #ff0000;
            animation: pulse 1s infinite;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            display: none;
            text-align: center;
            font-weight: bold;
        }

        .message.success { 
            background-color: rgba(78, 204, 163, 0.2); 
            color: #4ecca3; 
            border: 1px solid #4ecca3; 
        }

        .message.error { 
            background-color: rgba(233, 69, 96, 0.2); 
            color: #e94560; 
            border: 1px solid #e94560; 
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        footer {
            text-align: center;
            padding: 30px;
            border-top: 2px solid #333;
            margin-top: 40px;
            color: #666;
        }

        @media (max-width: 600px) {
            h1 { font-size: 2em; }
            .fighters { flex-direction: column; }
            .vs { padding: 10px 0; }
            .bet-buttons { flex-direction: column; }
            .bet-btn { width: 100%; }
            .user-bar { flex-direction: column; gap: 10px; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ========== የተጠቃሚ መረጃ ባር ========== -->
        <div class="user-bar" id="userBar">
            <div class="user-info" id="userInfo"></div>
            <div id="authButtons"></div>
        </div>

        <header>
            <h1>🥊 Fight P2P</h1>
            <p class="tagline">Peer-to-Peer Boxing Betting Arena</p>
        </header>

        <div class="user-balance">
            <div>Your Balance</div>
            <div class="balance-amount" id="balanceAmount">1,000 Points</div>
        </div>

        <!-- ✅ አዲስ: የማስታወቂያ ቦታ -->
        <div id="ads-container" class="ads-container"></div>

        <div class="fights-section">
            <h2 class="section-title">🔥 Upcoming Fights</h2>
            <div id="fights-container"></div>
        </div>

        <footer>
            <p>© 2026 Fight P2P - Bet Responsibly</p>
            <p style="margin-top: 10px; font-size: 0.9em;">Virtual Points System - No Real Money</p>
        </footer>
    </div>

    <script>
        let userPoints = parseInt(localStorage.getItem('balance')) || 1000;
        const token = localStorage.getItem('token');
        const username = localStorage.getItem('username');

        function initializeUserInterface() {
            const userInfoDiv = document.getElementById('userInfo');
            const authButtonsDiv = document.getElementById('authButtons');

            if (token && username) {
                userInfoDiv.innerHTML = `Welcome, <span>${username}</span>!`;
                
                // ✅ ማስተካከያ: የ "Leaderboard" ቁልፍ ተጨምሯል
                authButtonsDiv.innerHTML = `
                    <a href="/leaderboard.html" class="btn" style="margin-right: 10px; background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%); color: black;">🏆 Leaderboard</a>
                    <a href="/bets.html" class="btn" style="margin-right: 10px; background: linear-gradient(135deg, #4ecca3 0%, #3fa890 100%); color: black;">🔥 ክፍት ውርርዶች</a>
                    <button class="btn btn-logout" onclick="logout()">Logout</button>
                `;
                updateBalance();
            } else {
                userInfoDiv.innerHTML = `Welcome, Guest!`;
                authButtonsDiv.innerHTML = `<a href="/login.html" class="btn btn-login">Login / Register</a>`;
                disableAllBetButtons();
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('username');
            localStorage.removeItem('balance');
            alert('Logged out successfully!');
            window.location.reload();
        }

        function disableAllBetButtons() {
            const betButtons = document.querySelectorAll('.bet-btn');
            betButtons.forEach(btn => {
                btn.disabled = true;
                const originalText = btn.innerHTML;
                if (!originalText.includes('LOGIN TO BET')) {
                    btn.dataset.originalText = originalText;
                    btn.innerHTML = 'LOGIN TO BET<br><small>Please login first</small>';
                }
            });
        }

        async function loadFights() {
            try {
                const response = await fetch('/api/fights');
                const fights = await response.json();
                displayFights(fights);
            } catch (error) {
                console.error('Error loading fights:', error);
                displayFights(getSampleFights());
            }
        }

        function getSampleFights() {
            return [
                {
                    id: 1,
                    fighter1: { name: 'Ethiopian Lion', record: '15-2-0', photo: '🦁' },
                    fighter2: { name: 'African Thunder', record: '12-3-1', photo: '⚡' },
                    date: '2026-11-15',
                    status: 'upcoming',
                    bets: []
                },
                {
                    id: 2,
                    fighter1: { name: 'Addis Warrior', record: '10-1-0', photo: '🛡️' },
                    fighter2: { name: 'Nile Storm', record: '8-4-2', photo: '🌊' },
                    date: '2026-11-20',
                    status: 'upcoming',
                    bets: []
                }
            ];
        }

        function displayFights(fights) {
            const container = document.getElementById('fights-container');
            container.innerHTML = '';
            fights.forEach(fight => {
                container.appendChild(createFightCard(fight));
            });
            if (!token || !username) disableAllBetButtons();
        }

        function createFightCard(fight) {
            const card = document.createElement('div');
            card.className = 'fight-card';
            const statusClass = fight.status === 'live' ? 'status-live' : 'status-upcoming';
            const statusText = fight.status === 'live' ? '🔴 LIVE' : '📅 UPCOMING';

            card.innerHTML = `
                <div class="fight-header">
                    <span class="${statusClass}">${statusText}</span>
                    <span class="fight-date">${formatDate(fight.date)}</span>
                </div>
                <div class="fighters">
                    <div class="fighter">
                        <div class="fighter-photo">${fight.fighter1.photo}</div>
                        <div class="fighter-name">${fight.fighter1.name}</div>
                        <div class="fighter-record">${fight.fighter1.record}</div>
                    </div>
                    <div class="vs">VS</div>
                    <div class="fighter">
                        <div class="fighter-photo">${fight.fighter2.photo}</div>
                        <div class="fighter-name">${fight.fighter2.name}</div>
                        <div class="fighter-record">${fight.fighter2.record}</div>
                    </div>
                </div>
                <div class="betting-section">
                    <!-- ✅ አዲስ: የውርርድ መጠን መምረጫ -->
                    <div class="bet-amount-selector">
                        <label style="color: #ffd700; font-weight: bold; display: block; margin-bottom: 10px;">Select Bet Amount (Min: 50, Max: 10,000)</label>
                        <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 10px;">
                            <button class="quick-bet-btn" onclick="setBetAmount(50, 'fight${fight.id}')">50</button>
                            <button class="quick-bet-btn" onclick="setBetAmount(100, 'fight${fight.id}')">100</button>
                            <button class="quick-bet-btn" onclick="setBetAmount(200, 'fight${fight.id}')">200</button>
                            <button class="quick-bet-btn" onclick="setBetAmount(500, 'fight${fight.id}')">500</button>
                            <button class="quick-bet-btn" onclick="setBetAmount(1000, 'fight${fight.id}')">1000</button>
                        </div>
                        <input type="number" id="bet-amount-fight${fight.id}" class="custom-bet-input" placeholder="Or enter custom amount" min="50" max="10000" value="100">
                    </div>
                    
                    <div class="bet-buttons">
                        <button class="bet-btn bet-btn-fighter1" onclick="placeBet('${fight.fighter1.name}', 'red', 'fight${fight.id}', 'msg-fight${fight.id}')">
                            Bet on ${fight.fighter1.name}
                        </button>
                        <button class="bet-btn bet-btn-fighter2" onclick="placeBet('${fight.fighter2.name}', 'blue', 'fight${fight.id}', 'msg-fight${fight.id}')">
                            Bet on ${fight.fighter2.name}
                        </button>
                    </div>
                    <div id="msg-fight${fight.id}" class="message"></div>
                    ${fight.bets.length > 0 ? `
                        <div class="current-bets">
                            <strong>Current Bets:</strong>
                            ${fight.bets.map(bet => `<div class="bet-item"><span>${bet.fighter}</span><span>${bet.amount} pts</span></div>`).join('')}
                        </div>
                    ` : ''}
                </div>
            `;
            return card;
        }

        function formatDate(dateString) {
            return new Date(dateString).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        }

        // ✅ አዲስ: የውርርድ መጠንን በፍጥነት ለመምረጥ
        function setBetAmount(amount, fightId) {
            const input = document.getElementById(`bet-amount-fight${fightId}`);
            if (input) input.value = amount;
        }

        // ✅ የተሻሻለ: መጠኑን ከ Input ሳጥን የሚያነብ እና የደህንነት ማረጋገጫ ያለው
        async function placeBet(fighterName, fighterChoice, fightId, messageId) {
            const messageDiv = document.getElementById(messageId);
            if (!token || !username) {
                alert('Please login first to place a bet!');
                window.location.href = '/login.html';
                return;
            }
            
            const amountInput = document.getElementById(`bet-amount-fight${fightId}`);
            const betAmount = parseInt(amountInput.value);

            // 🔒 SECURITY FIRST: Frontend Validation
            if (isNaN(betAmount) || betAmount < 50) {
                showMessage(messageDiv, 'error', '❌ Minimum bet is 50 points!');
                return;
            }
            if (betAmount > 10000) {
                showMessage(messageDiv, 'error', '❌ Maximum bet is 10,000 points!');
                return;
            }
            if (userPoints < betAmount) {
                showMessage(messageDiv, 'error', '❌ Insufficient points!');
                return;
            }

            showMessage(messageDiv, 'success', `⏳ Processing bet of ${betAmount} points...`);

            try {
                const response = await fetch('https://fight-p2p.onrender.com/api/bets/create', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ fighterChoice, amount: betAmount })
                });
                const data = await response.json();

                if (response.ok) {
                    userPoints = data.newBalance || (userPoints - betAmount);
                    localStorage.setItem('balance', userPoints);
                    updateBalance();
                    showMessage(messageDiv, 'success', `✅ Successfully bet ${betAmount} points on ${fighterName}!`);
                    setTimeout(() => window.location.reload(), 2000);
                } else {
                    showMessage(messageDiv, 'error', '❌ ' + (data.message || 'Bet failed'));
                }
            } catch (error) {
                console.error('Bet error:', error);
                showMessage(messageDiv, 'error', '❌ Network error. Please try again.');
            }
        }

        function showMessage(element, type, text) {
            element.className = `message ${type}`;
            element.innerText = text;
            element.style.display = 'block';
            setTimeout(() => { element.style.display = 'none'; }, 5000);
        }

        function updateBalance() {
            const balanceElement = document.getElementById('balanceAmount');
            if (balanceElement) {
                balanceElement.textContent = userPoints.toLocaleString() + ' Points';
            }
        }

        // ✅ አዲስ: ማስታወቂያዎችን ከ Backend ማምጣት እና ማሳየት
        async function loadAds() {
            try {
                const response = await fetch('https://fight-p2p.onrender.com/api/ads');
                const ads = await response.json();
                displayAds(ads);
            } catch (error) {
                console.error('Error loading ads:', error);
            }
        }

        function displayAds(ads) {
            const container = document.getElementById('ads-container');
            if (!ads || ads.length === 0) {
                container.style.display = 'none';
                return;
            }
            
            container.innerHTML = '';
            ads.forEach(ad => {
                const adLink = document.createElement('a');
                adLink.className = 'ad-banner';
                adLink.href = ad.targetUrl;
                adLink.target = '_blank'; // በአዲስ ታብ እንዲከፈት
                adLink.rel = 'noopener noreferrer'; // ✅ Security: Tabnabbing መከላከል
                
                adLink.innerHTML = `
                    <span class="ad-label">Ad</span>
                    <img src="${ad.imageUrl}" alt="${ad.title}">
                `;
                container.appendChild(adLink);
            });
        }

        // ========== Page Load ==========
        document.addEventListener('DOMContentLoaded', () => {
            initializeUserInterface();
            loadFights();
            loadAds(); // ✅ ማስታወቂያዎችን መጫን
        });
    </script>
</body>
</html>
