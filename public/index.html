<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fight P2P - Premium Boxing Match Predictions</title>
    <meta name="description" content="Fight P2P is a premium peer-to-peer boxing match prediction platform using virtual points. No real money involved.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    
    <!-- 🟢 ADSTERRA PLACEHOLDER: Paste your Adsterra Pop-under or Direct Link script here -->
    <!-- <script type='text/javascript' src='//YOUR_ADSTERRA_SCRIPT.js'></script> -->

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at 50% 0%, #1e1e30 0%, #0a0a12 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 15px;
            padding-bottom: 80px;
            line-height: 1.6;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        
        .top-bar {
            padding: 12px 16px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #e94560;
        }
        .user-info { font-size: 0.95em; font-weight: 600; color: #ffffff; }
        .user-info a {
            color: #4ecca3;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.3s;
        }
        .user-info a:hover { color: #ffd700; }
        .btn-logout {
            padding: 8px 14px;
            background: rgba(233, 69, 96, 0.15);
            color: #e94560;
            border: 1px solid rgba(233, 69, 96, 0.3);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8em;
            transition: all 0.3s;
        }
        .btn-logout:hover { background: #e94560; color: white; }

        header { text-align: center; padding: 20px 0 30px; }
        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.5em;
            font-weight: 900;
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }
        .tagline { color: #888; font-size: 1em; }

        .organizations-section { margin-bottom: 30px; }
        .org-scroll-container {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 10px;
            scrollbar-width: thin;
            scrollbar-color: #ffd700 rgba(255, 255, 255, 0.1);
        }
        .org-scroll-container::-webkit-scrollbar { height: 6px; }
        .org-scroll-container::-webkit-scrollbar-thumb { background: #ffd700; border-radius: 3px; }
        .org-card {
            flex: 0 0 auto;
            width: 110px;
            padding: 15px 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .org-card:hover, .org-card.active {
            background: rgba(255, 215, 0, 0.1);
            border-color: #ffd700;
            transform: translateY(-3px);
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.15);
        }
        .org-logo {
            width: 50px; /* 🆕 Slightly larger, definitely not smaller */
            height: 50px;
            object-fit: contain;
            margin-bottom: 8px;
            border-radius: 50%;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .org-name {
            font-size: 0.8em;
            font-weight: 600;
            color: #e0e0e0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .org-card.active .org-name { color: #ffd700; }

        .ads-container { margin-bottom: 30px; display: flex; flex-direction: column; gap: 15px; align-items: center; }
        .ad-banner {
            width: 100%; max-width: 728px; min-height: 90px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; position: relative;
            text-decoration: none;
        }
        .ad-banner img, .ad-banner video { 
            max-width: 100%; 
            max-height: 150px; 
            object-fit: contain; 
        }
        .ad-label {
            position: absolute; top: 8px; right: 10px;
            font-size: 0.65em; color: #888; background: rgba(0,0,0,0.6);
            padding: 3px 8px; border-radius: 4px; text-transform: uppercase;
        }

        .fights-section { margin-bottom: 40px; }
        .section-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.4em; font-weight: 800; color: #ffffff;
            margin-bottom: 20px; padding-left: 15px;
            border-left: 4px solid #e94560;
        }

        .fight-card {
            padding: 25px 20px;
            margin-bottom: 25px;
        }
        .fight-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .fight-date { background: rgba(255, 255, 255, 0.05); color: #ccc; padding: 6px 14px; border-radius: 20px; font-weight: 600; font-size: 0.8em; }
        .status-upcoming { color: #4ecca3; font-weight: 700; font-size: 0.8em; }
        .status-live { color: #e94560; font-weight: 800; animation: pulse 1.5s infinite; font-size: 0.8em; }

        .matchup-container {
            display: flex !important;
            flex-direction: row !important;
            align-items: center !important;
            justify-content: space-between !important;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            padding: 20px 10px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .fighter { 
            flex: 1 !important; 
            text-align: center !important; 
            padding: 10px 5px !important;
            cursor: pointer;
            transition: transform 0.2s ease;
            border-radius: 12px;
        }
        .fighter:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.03);
        }
        .fighter:hover .fighter-name { color: #ffd700; }
        
        .fighter-photo { 
            font-size: 3.5em; 
            margin-bottom: 8px; 
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4)); 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90px; /* 🆕 Ensured not smaller */
        }
        .fighter-photo img {
            width: 90px; /* 🆕 Ensured not smaller */
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ffd700;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }
        .fighter-name { font-family: 'Montserrat', sans-serif; font-size: 1.1em; font-weight: 800; color: #ffffff; margin-bottom: 4px; transition: color 0.2s; }
        .fighter-record { color: #888; font-size: 0.8em; font-weight: 500; background: rgba(255,255,255,0.05); display: inline-block; padding: 3px 10px; border-radius: 20px; }
        .predict-hint {
            font-size: 0.75em;
            color: #ffd700;
            margin-top: 8px;
            opacity: 0.8;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        
        .vs-badge { 
            font-family: 'Montserrat', sans-serif;
            font-size: 1.2em !important; 
            font-weight: 900 !important; 
            color: #e94560 !important; 
            background: rgba(233, 69, 96, 0.1);
            border: 1px solid rgba(233, 69, 96, 0.3);
            padding: 8px 16px !important;
            border-radius: 50px;
            margin: 0 10px !important;
            flex-shrink: 0 !important;
        }

        /* 🆕 New Clean Prediction Panel */
        .prediction-panel {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 12px;
            padding: 20px;
            margin-top: 15px;
            animation: slideDown 0.3s ease-out;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .prediction-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            color: #ffd700;
            font-weight: 600;
        }
        .close-prediction {
            background: none;
            border: none;
            color: #888;
            font-size: 1.2em;
            cursor: pointer;
            padding: 0 5px;
            transition: color 0.2s;
        }
        .close-prediction:hover { color: #fff; }

        .prediction-amount-selector { text-align: center; }
        .prediction-amount-selector label { color: #ffd700; font-weight: 600; display: block; margin-bottom: 12px; font-size: 0.85em; }
        
        .quick-prediction-grid { 
            display: flex; 
            gap: 8px; 
            justify-content: center; 
            margin-bottom: 12px; 
            flex-wrap: wrap; 
        }
        .quick-prediction-btn {
            background: rgba(255, 255, 255, 0.05);
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9em;
            transition: all 0.2s;
        }
        .quick-prediction-btn:hover, .quick-prediction-btn.active { 
            background: rgba(255, 215, 0, 0.15); 
            color: #ffd700; 
            border-color: #ffd700; 
        }

        .custom-prediction-input {
            width: 100%; max-width: 280px;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            text-align: center;
            font-size: 1.1em;
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
        }
        .custom-prediction-input:focus { outline: none; border-color: #ffd700; }

        .btn-confirm-prediction {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #4ecca3 0%, #3fa890 100%);
            color: #0a0a12;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            font-size: 1em;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s;
        }
        .btn-confirm-prediction:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        .message {
            margin-top: 15px; padding: 12px; border-radius: 10px;
            display: none; text-align: center; font-weight: 600; font-size: 0.9em;
        }
        .message.success { background-color: rgba(78, 204, 163, 0.1); color: #4ecca3; border: 1px solid rgba(78, 204, 163, 0.2); }
        .message.error { background-color: rgba(233, 69, 96, 0.1); color: #e94560; border: 1px solid rgba(233, 69, 96, 0.2); }
        .message.warning { background-color: rgba(255, 215, 0, 0.1); color: #ffd700; border: 1px solid rgba(255, 215, 0, 0.2); }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10, 10, 18, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 1000;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.3);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #888;
            font-size: 0.75em;
            font-weight: 600;
            transition: all 0.3s;
            padding: 8px 12px;
        }
        .nav-item:hover, .nav-item.active {
            color: #ffd700;
            transform: translateY(-2px);
        }
        .nav-icon {
            font-size: 1.5em;
            margin-bottom: 4px;
        }

        footer { text-align: center; padding: 30px 20px; border-top: 1px solid rgba(255, 255, 255, 0.05); margin-top: 30px; color: #555; font-size: 0.8em; }
        .footer-links { margin-top: 15px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
        .footer-links a { color: #888; text-decoration: none; margin: 0 8px; transition: color 0.3s; }
        .footer-links a:hover { color: #ffd700; }

        @media (max-width: 600px) {
            h1 { font-size: 2em; }
            .fighter-photo { font-size: 3em; }
            .fighter-name { font-size: 0.95em; }
            .vs-badge { font-size: 1em !important; padding: 6px 12px !important; margin: 0 5px !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar glass-panel" id="topBar">
            <div class="user-info" id="userInfo"></div>
            <button class="btn-logout" id="logoutBtn" style="display: none;" onclick="logout()">Logout</button>
        </div>

        <header>
            <h1>🥊 Fight P2P</h1>
            <p class="tagline">Premium Peer-to-Peer Boxing Match Predictions</p>
        </header>

        <!-- 🆕 Daily Bonus Removed from Home (Moved to Profile) -->

        <div id="ads-container" class="ads-container"></div>

        <div id="organizations-container" class="organizations-section">
            <h2 class="section-title">🏢 Choose Organization</h2>
            <div id="org-scroll-container" class="org-scroll-container">
                <!-- Organizations will be injected here -->
            </div>
        </div>

        <div class="fights-section">
            <h2 class="section-title">🔥 Upcoming Fights</h2>
            <div id="fights-container"></div>
        </div>

        <footer>
            <p>© 2026 Fight P2P - Play Responsibly</p>
            <p style="margin-top: 8px; opacity: 0.7;">Virtual Points System - No Real Money</p>
            <div class="footer-links">
                <a href="/about.html">About</a>
                <a href="/contact.html">Contact</a>
                <a href="/privacy.html">Privacy Policy</a>
                <a href="/terms.html">Terms & Conditions</a>
            </div>
        </footer>
    </div>

    <nav class="bottom-nav">
        <a href="/" class="nav-item active">
            <span class="nav-icon">🏠</span>
            <span>Home</span>
        </a>
        <a href="/predictions.html" class="nav-item">
            <span class="nav-icon">🥊</span>
            <span>Fights</span>
        </a>
        <a href="/leaderboard.html" class="nav-item">
            <span class="nav-icon">🏆</span>
            <span>Leaderboard</span>
        </a>
        <a href="/profile.html" class="nav-item">
            <span class="nav-icon">👤</span>
            <span>Profile</span>
        </a>
    </nav>

    <script>
        let userPoints = parseInt(localStorage.getItem('balance')) || 1000;
        const token = localStorage.getItem('token');
        const username = localStorage.getItem('username');
        const isVerified = localStorage.getItem('isVerified') === 'true';
        let selectedOrgId = null; 

        // 🔒 SECURITY FIRST: Prevent XSS by escaping HTML characters
        function escapeHTML(str) {
            if (str === null || str === undefined) return '';
            return String(str).replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        }

        function renderFighterPhoto(photo) {
            if (!photo) return '🥊';
            if (typeof photo === 'string' && (photo.startsWith('http://') || photo.startsWith('https://'))) {
                return `<img src="${escapeHTML(photo)}" alt="Fighter Photo">`;
            }
            return escapeHTML(photo);
        }

        function initializeUserInterface() {
            const userInfoDiv = document.getElementById('userInfo');
            const logoutBtn = document.getElementById('logoutBtn');
            
            if (token && username) {
                userInfoDiv.innerHTML = `Welcome, <a href="/profile.html">${escapeHTML(username)}</a>!`;
                logoutBtn.style.display = 'block';
            } else {
                userInfoDiv.innerHTML = `Welcome, Guest!`;
                logoutBtn.style.display = 'none';
            }
        }

        function logout() {
            localStorage.clear();
            sessionStorage.clear();
            window.location.href = '/login.html';
        }

        async function loadOrganizations() {
            try {
                const response = await fetch('/api/organizations');
                const result = await response.json();
                if (result.success && result.data.length > 0) {
                    renderOrganizations(result.data);
                } else {
                    document.getElementById('organizations-container').style.display = 'none';
                }
            } catch (error) {
                console.error('Error loading organizations:', error);
                document.getElementById('organizations-container').style.display = 'none';
            }
        }

        function renderOrganizations(orgs) {
            const container = document.getElementById('org-scroll-container');
            container.innerHTML = '';
            
            const allCard = document.createElement('div');
            allCard.className = `org-card ${selectedOrgId === null ? 'active' : ''}`;
            allCard.innerHTML = `<div style="font-size: 2em; margin-bottom: 8px;">🔥</div><div class="org-name">All Fights</div>`;
            allCard.onclick = (e) => selectOrganization(null, e.currentTarget);
            container.appendChild(allCard);

            orgs.forEach(org => {
                const card = document.createElement('div');
                card.className = `org-card ${selectedOrgId === org._id ? 'active' : ''}`;
                const logoHtml = org.logoUrl ? `<img src="${escapeHTML(org.logoUrl)}" class="org-logo" alt="${escapeHTML(org.name)}">` : `<div style="font-size: 2em; margin-bottom: 8px;">🏢</div>`;
                card.innerHTML = `${logoHtml}<div class="org-name">${escapeHTML(org.name)}</div>`;
                card.onclick = (e) => selectOrganization(org._id, e.currentTarget);
                container.appendChild(card);
            });
        }

        function selectOrganization(orgId, element) {
            selectedOrgId = orgId;
            document.querySelectorAll('.org-card').forEach(c => c.classList.remove('active'));
            if (element) {
                element.classList.add('active');
            }
            loadFights(); 
        }

        // 🚀 HIGH TRAFFIC: Robust filtering
        async function loadFights() {
            const container = document.getElementById('fights-container');
            container.innerHTML = '<p style="text-align:center; color:#888; padding:20px;">⏳ Loading fights from database...</p>';
            try {
                const response = await fetch('/api/fights');
                if (!response.ok) throw new Error(`Server returned ${response.status}`);
                let fights = await response.json();
                
                if (selectedOrgId) {
                    fights = fights.filter(f => {
                        const fightOrgId = typeof f.organization === 'object' ? f.organization._id : f.organization;
                        return fightOrgId === selectedOrgId;
                    });
                }

                if (Array.isArray(fights) && fights.length > 0) {
                    displayFights(fights);
                } else {
                    container.innerHTML = '<p style="text-align:center; color:#888; padding:20px;">No upcoming fights for this organization at the moment.</p>';
                }
            } catch (error) {
                console.error('Error loading fights:', error);
                container.innerHTML = `<p style="text-align:center; color:#e94560; padding:20px;">⚠️ Failed to load fights.<br><small>Check console (F12) for details.</small></p>`;
            }
        }

        function displayFights(fights) {
            const container = document.getElementById('fights-container');
            container.innerHTML = '';
            fights.forEach(fight => {
                const card = createFightCard(fight);
                container.appendChild(card);
            });
        }

        // 🆕 New Clean Card Structure with Click-to-Predict
        function createFightCard(fight) {
            const card = document.createElement('div');
            card.className = 'fight-card glass-panel';
            const statusClass = fight.status === 'live' ? 'status-live' : 'status-upcoming';
            const statusText = fight.status === 'live' ? '🔴 LIVE' : '📅 UPCOMING';

            card.innerHTML = `
                <div class="fight-header">
                    <span class="${statusClass}">${statusText}</span>
                    <span class="fight-date">${new Date(fight.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</span>
                </div>
                <div class="matchup-container">
                    <div class="fighter" onclick="openPrediction('${fight._id}', 'red', '${escapeHTML(fight.fighter1.name)}')">
                        <div class="fighter-photo">${renderFighterPhoto(fight.fighter1.photo)}</div>
                        <div class="fighter-name">${escapeHTML(fight.fighter1.name)}</div>
                        <div class="fighter-record">${escapeHTML(fight.fighter1.record)}</div>
                        <div class="predict-hint">Tap to Predict</div>
                    </div>
                    <div class="vs-badge">VS</div>
                    <div class="fighter" onclick="openPrediction('${fight._id}', 'blue', '${escapeHTML(fight.fighter2.name)}')">
                        <div class="fighter-photo">${renderFighterPhoto(fight.fighter2.photo)}</div>
                        <div class="fighter-name">${escapeHTML(fight.fighter2.name)}</div>
                        <div class="fighter-record">${escapeHTML(fight.fighter2.record)}</div>
                        <div class="predict-hint">Tap to Predict</div>
                    </div>
                </div>
                
                <div id="prediction-panel-${fight._id}" class="prediction-panel" style="display: none;">
                    <div class="prediction-header">
                        <span>Predicting for: <strong id="selected-fighter-name-${fight._id}"></strong></span>
                        <button class="close-prediction" onclick="closePrediction('${fight._id}')">✕</button>
                    </div>
                    <div class="prediction-amount-selector">
                        <label>Select Amount (Min: 50, Max: 10,000)</label>
                        <div class="quick-prediction-grid">
                            <button class="quick-prediction-btn" onclick="setAmount('${fight._id}', 50)">50</button>
                            <button class="quick-prediction-btn" onclick="setAmount('${fight._id}', 100)">100</button>
                            <button class="quick-prediction-btn" onclick="setAmount('${fight._id}', 200)">200</button>
                            <button class="quick-prediction-btn" onclick="setAmount('${fight._id}', 500)">500</button>
                            <button class="quick-prediction-btn" onclick="setAmount('${fight._id}', 1000)">1000</button>
                        </div>
                        <input type="number" id="custom-amount-${fight._id}" class="custom-prediction-input" placeholder="Custom amount" min="50" max="10000" value="100">
                    </div>
                    <button class="btn-confirm-prediction" onclick="submitPrediction('${fight._id}')">Confirm Prediction</button>
                    <div id="message-${fight._id}" class="message"></div>
                </div>
            `;
            return card;
        }

        // 🆕 Prediction Flow Functions
        function openPrediction(fightId, fighterChoice, fighterName) {
            if (!token || !username) {
                alert('Please login first to predict!');
                window.location.href = '/login.html';
                return;
            }
            
            document.querySelectorAll('.prediction-panel').forEach(p => p.style.display = 'none');
            
            const panel = document.getElementById(`prediction-panel-${fightId}`);
            if (panel) {
                panel.style.display = 'block';
                document.getElementById(`selected-fighter-name-${fightId}`).textContent = fighterName;
                panel.dataset.fighterChoice = fighterChoice;
                panel.dataset.fighterName = fighterName;
                
                const msgDiv = document.getElementById(`message-${fightId}`);
                msgDiv.className = 'message';
                msgDiv.style.display = 'none';
                
                panel.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function closePrediction(fightId) {
            const panel = document.getElementById(`prediction-panel-${fightId}`);
            if (panel) panel.style.display = 'none';
        }

        function setAmount(fightId, amount) {
            const input = document.getElementById(`custom-amount-${fightId}`);
            input.value = amount;
            
            const panel = document.getElementById(`prediction-panel-${fightId}`);
            panel.querySelectorAll('.quick-prediction-btn').forEach(btn => {
                btn.classList.remove('active');
                if (parseInt(btn.textContent) === amount) {
                    btn.classList.add('active');
                }
            });
        }

        async function submitPrediction(fightId) {
            const panel = document.getElementById(`prediction-panel-${fightId}`);
            const fighterChoice = panel.dataset.fighterChoice;
            const fighterName = panel.dataset.fighterName;
            const amount = parseInt(document.getElementById(`custom-amount-${fightId}`).value);
            const msgDiv = document.getElementById(`message-${fightId}`);

            if (isNaN(amount) || amount < 50) { 
                showMessageLocal(msgDiv, 'error', '❌ Minimum prediction is 50 points!'); 
                return; 
            }
            if (amount > 10000) { 
                showMessageLocal(msgDiv, 'error', '❌ Maximum prediction is 10,000 points!'); 
                return; 
            }
            if (userPoints < amount) { 
                showMessageLocal(msgDiv, 'error', '❌ Insufficient points!'); 
                return; 
            }
            if (amount > 5000 && !isVerified) {
                showMessageLocal(msgDiv, 'warning', '⚠️ Predictions over 5,000 points require ID verification. Please go to your Profile to verify.');
                return;
            }

            showMessageLocal(msgDiv, 'success', '⏳ Processing...');

            try {
                const response = await fetch('/api/bets/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ eventId: fightId, fighterChoice, amount })
                });
                const data = await response.json();
                if (response.ok) {
                    userPoints = data.newBalance || (userPoints - amount);
                    localStorage.setItem('balance', userPoints);
                    showMessageLocal(msgDiv, 'success', `✅ Prediction placed on ${fighterName}!`);
                    
                    panel.innerHTML = '<div style="text-align:center; color:#4ecca3; padding: 20px; font-weight:bold;">✅ Prediction Successfully Placed!</div>';
                    setTimeout(() => window.location.reload(), 1500);
                } else {
                    showMessageLocal(msgDiv, 'error', '❌ ' + (data.message || 'Prediction failed'));
                }
            } catch (error) {
                showMessageLocal(msgDiv, 'error', '❌ Network error.');
            }
        }

        function showMessageLocal(element, type, text) {
            element.textContent = text; // 🔒 Security: textContent prevents XSS
            element.className = `message ${type}`;
            element.style.display = 'block';
            setTimeout(() => { element.style.display = 'none'; }, 4000);
        }

        async function loadAds() {
            try {
                const response = await fetch('/api/ads');
                const ads = await response.json();
                const container = document.getElementById('ads-container');
                if (!ads || ads.length === 0) { container.style.display = 'none'; return; }
                
                container.innerHTML = '';
                ads.forEach(ad => {
                    const link = document.createElement('a');
                    link.className = 'ad-banner';
                    link.href = escapeHTML(ad.targetUrl);
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';
                    
                    const mediaUrl = ad.mediaUrl || ad.imageUrl;
                    let mediaElement = '';
                    
                    if (ad.type === 'video') {
                        mediaElement = `<video src="${escapeHTML(mediaUrl)}" autoplay muted loop playsinline></video>`;
                    } else {
                        mediaElement = `<img src="${escapeHTML(mediaUrl)}" alt="${escapeHTML(ad.title)}">`;
                    }
                    
                    link.innerHTML = `<span class="ad-label">Ad</span>${mediaElement}`;
                    container.appendChild(link);
                });
            } catch (error) { console.error('Ad error:', error); }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initializeUserInterface();
            loadOrganizations(); 
            loadFights();
            loadAds();
        });
    </script>
</body>
</html>
