<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fight P2P - Boxing Betting Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* ========== የተጠቃሚ መረጃ ባር (User Bar) ========== */
        .user-bar {
            background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid #e94560;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .user-info {
            font-size: 1.1em;
            font-weight: bold;
        }

        .user-info span {
            color: #4ecca3;
            font-weight: bold;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9em;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
        }

        .btn-login {
            background: linear-gradient(135deg, #4ecca3 0%, #3fa890 100%);
            color: #0f0f1a;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(78, 204, 163, 0.4);
        }

        .btn-logout {
            background: linear-gradient(135deg, #e94560 0%, #c73650 100%);
            color: white;
        }

        .btn-logout:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(233, 69, 96, 0.4);
        }
        /* ================================================ */

        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 3px solid #ff0000;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            color: #ffd700;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 2px 2px 4px rgba(255, 0, 0, 0.5);
        }

        .tagline {
            color: #ff0000;
            font-size: 1.2em;
            margin-top: 10px;
        }

        .user-balance {
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
            color: #000;
            padding: 15px 25px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .balance-amount {
            font-size: 2em;
            color: #ff0000;
        }

        .fights-section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 1.8em;
            color: #ffd700;
            margin-bottom: 20px;
            padding-left: 15px;
            border-left: 4px solid #ff0000;
        }

        .fight-card {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            border: 2px solid #333;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .fight-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .fight-date {
            background: #ff0000;
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: bold;
        }

        .fighters {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .fighter {
            text-align: center;
            flex: 1;
            min-width: 120px;
            padding: 15px;
        }

        .fighter-photo {
            font-size: 4em;
            margin-bottom: 10px;
        }

        .fighter-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 5px;
        }

        .fighter-record {
            color: #888;
            font-size: 0.9em;
        }

        .vs {
            font-size: 2em;
            font-weight: bold;
            color: #ff0000;
            padding: 0 20px;
            text-shadow: 2px 2px 4px rgba(255, 0, 0, 0.8);
        }

        .betting-section {
            background: #0a0a0a;
            padding: 20px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .bet-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .bet-btn {
            flex: 1;
            min-width: 150px;
            padding: 15px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .bet-btn-fighter1 {
            background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);
            color: white;
        }

        .bet-btn-fighter2 {
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
            color: black;
        }

        .bet-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
        }

        .bet-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .bet-btn:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .current-bets {
            margin-top: 15px;
            padding: 15px;
            background: #1a1a1a;
            border-radius: 8px;
        }

        .bet-item {
            padding: 10px;
            margin: 5px 0;
            background: #2a2a2a;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-upcoming {
            color: #00ff00;
        }

        .status-live {
            color: #ff0000;
            animation: pulse 1s infinite;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            display: none;
            text-align: center;
            font-weight: bold;
        }

        .message.success { 
            background-color: rgba(78, 204, 163, 0.2); 
            color: #4ecca3; 
            border: 1px solid #4ecca3; 
        }

        .message.error { 
            background-color: rgba(233, 69, 96, 0.2); 
            color: #e94560; 
            border: 1px solid #e94560; 
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        footer {
            text-align: center;
            padding: 30px;
            border-top: 2px solid #333;
            margin-top: 40px;
            color: #666;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2em;
            }

            .fighters {
                flex-direction: column;
            }

            .vs {
                padding: 10px 0;
            }

            .bet-buttons {
                flex-direction: column;
            }

            .bet-btn {
                width: 100%;
            }

            .user-bar {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ========== የተጠቃሚ መረጃ ባር ========== -->
        <div class="user-bar" id="userBar">
            <div class="user-info" id="userInfo">
                <!-- JavaScript ይህንን ይሞላል -->
            </div>
            <div id="authButtons">
                <!-- JavaScript ይህንን ይሞላል -->
            </div>
        </div>
        <!-- ========================================== -->

        <header>
            <h1>🥊 Fight P2P</h1>
            <p class="tagline">Peer-to-Peer Boxing Betting Arena</p>
        </header>

        <div class="user-balance">
            <div>Your Balance</div>
            <div class="balance-amount" id="balanceAmount">1,000 Points</div>
        </div>

        <div class="fights-section">
            <h2 class="section-title">🔥 Upcoming Fights</h2>

            <div id="fights-container">
                <!-- Fights will be loaded here -->
            </div>
        </div>

        <footer>
            <p>© 2026 Fight P2P - Bet Responsibly</p>
            <p style="margin-top: 10px; font-size: 0.9em;">Virtual Points System - No Real Money</p>
        </footer>
    </div>

    <script>
        // ========== የተጠቃሚ መረጃ እና ሎጊን ስቴትስ ==========
        let userPoints = parseInt(localStorage.getItem('balance')) || 1000;
        const token = localStorage.getItem('token');
        const username = localStorage.getItem('username');
        // =====================================================

        // Initialize user interface
        function initializeUserInterface() {
            const userInfoDiv = document.getElementById('userInfo');
            const authButtonsDiv = document.getElementById('authButtons');

            if (token && username) {
                // ተጠቃሚው ገቷል
                userInfoDiv.innerHTML = `Welcome, <span>${username}</span>!`;
                authButtonsDiv.innerHTML = `<button class="btn btn-logout" onclick="logout()">Logout</button>`;
                
                // ሂሳቡን ማዘመን
                updateBalance();
            } else {
                // ተጠቃው አልገባም
                userInfoDiv.innerHTML = `Welcome, Guest!`;
                authButtonsDiv.innerHTML = `<a href="/login.html" class="btn btn-login">Login / Register</a>`;
                
                // ርርድ ቁልችን ማሰናከል (Disable bet buttons)
                disableAllBetButtons();
            }
        }

        // Logout function
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('username');
            localStorage.removeItem('balance');
            alert('Logged out successfully!');
            window.location.reload();
        }

        // Disable all bet buttons
        function disableAllBetButtons() {
            const betButtons = document.querySelectorAll('.bet-btn');
            betButtons.forEach(btn => {
                btn.disabled = true;
                const originalText = btn.innerHTML;
                if (!originalText.includes('LOGIN TO BET')) {
                    btn.dataset.originalText = originalText;
                    btn.innerHTML = 'LOGIN TO BET<br><small>Please login first</small>';
                }
            });
        }

        // Enable bet buttons
        function enableBetButtons() {
            const betButtons = document.querySelectorAll('.bet-btn');
            betButtons.forEach(btn => {
                btn.disabled = false;
                if (btn.dataset.originalText) {
                    btn.innerHTML = btn.dataset.originalText;
                }
            });
        }

        // Load fights from API
        async function loadFights() {
            try {
                const response = await fetch('/api/fights');
                const fights = await response.json();
                displayFights(fights);
            } catch (error) {
                console.error('Error loading fights:', error);
                // Display sample fights if API fails
                displayFights(getSampleFights());
            }
        }

        function getSampleFights() {
            return [
                {
                    id: 1,
                    fighter1: { name: 'Ethiopian Lion', record: '15-2-0', photo: '🦁' },
                    fighter2: { name: 'African Thunder', record: '12-3-1', photo: '⚡' },
                    date: '2026-11-15',
                    status: 'upcoming',
                    bets: []
                },
                {
                    id: 2,
                    fighter1: { name: 'Addis Warrior', record: '10-1-0', photo: '🛡️' },
                    fighter2: { name: 'Nile Storm', record: '8-4-2', photo: '' },
                    date: '2026-11-20',
                    status: 'upcoming',
                    bets: []
                }
            ];
        }

        function displayFights(fights) {
            const container = document.getElementById('fights-container');
            container.innerHTML = '';

            fights.forEach(fight => {
                const fightCard = createFightCard(fight);
                container.appendChild(fightCard);
            });

            // After displaying fights, check if user is logged in
            if (!token || !username) {
                disableAllBetButtons();
            }
        }

        function createFightCard(fight) {
            const card = document.createElement('div');
            card.className = 'fight-card';

            const statusClass = fight.status === 'live' ? 'status-live' : 'status-upcoming';
            const statusText = fight.status === 'live' ? '🔴 LIVE' : '📅 UPCOMING';

            card.innerHTML = `
                <div class="fight-header">
                    <span class="${statusClass}">${statusText}</span>
                    <span class="fight-date">${formatDate(fight.date)}</span>
                </div>
                <div class="fighters">
                    <div class="fighter">
                        <div class="fighter-photo">${fight.fighter1.photo}</div>
                        <div class="fighter-name">${fight.fighter1.name}</div>
                        <div class="fighter-record">${fight.fighter1.record}</div>
                    </div>
                    <div class="vs">VS</div>
                    <div class="fighter">
                        <div class="fighter-photo">${fight.fighter2.photo}</div>
                        <div class="fighter-name">${fight.fighter2.name}</div>
                        <div class="fighter-record">${fight.fighter2.record}</div>
                    </div>
                </div>
                <div class="betting-section">
                    <div class="bet-buttons">
                        <button class="bet-btn bet-btn-fighter1" onclick="placeBet('${fight.fighter1.name}', 100, 'msg-fight${fight.id}')">
                            Bet on ${fight.fighter1.name}<br>
                            <small>100 Points</small>
                        </button>
                        <button class="bet-btn bet-btn-fighter2" onclick="placeBet('${fight.fighter2.name}', 100, 'msg-fight${fight.id}')">
                            Bet on ${fight.fighter2.name}<br>
                            <small>100 Points</small>
                        </button>
                    </div>
                    <div id="msg-fight${fight.id}" class="message"></div>
                    ${fight.bets.length > 0 ? `
                        <div class="current-bets">
                            <strong>Current Bets:</strong>
                            ${fight.bets.map(bet => `
                                <div class="bet-item">
                                    <span>${bet.fighter}</span>
                                    <span>${bet.amount} pts</span>
                                </div>
                            `).join('')}
                        </div>
                    ` : ''}
                </div>
            `;

            return card;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
        }

        // ========== P2P ውርር ማድረ (Place Bet via API) ==========
        async function placeBet(fighterName, amount, messageId) {
            const messageDiv = document.getElementById(messageId);
            
            // Check if user is logged in
            if (!token || !username) {
                alert('Please login first to place a bet!');
                window.location.href = '/login.html';
                return;
            }

            // Check balance
            if (userPoints < amount) {
                showMessage(messageDiv, 'error', '❌ Insufficient points!');
                return;
            }

            // Show processing message
            showMessage(messageDiv, 'success', ' Processing your bet...');

            try {
                // ወደ P2P Backend API መላክ
                const response = await fetch('https://fight-p2p.onrender.com/api/bets/create', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ 
                        fighterChoice: fighterName.toLowerCase().includes('lion') || fighterName.toLowerCase().includes('ethiopian') ? 'red' : 'blue',
                        amount: amount
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    // ሂሳቡን ማዘመን
                    userPoints = data.newBalance || (userPoints - amount);
                    localStorage.setItem('balance', userPoints);
                    updateBalance();
                    
                    showMessage(messageDiv, 'success', `✅ Successfully bet ${amount} points on ${fighterName}!`);
                    
                    // Refresh page after 2 seconds
                    setTimeout(() => {
                        window.location.reload();
                    }, 2000);
                } else {
                    showMessage(messageDiv, 'error', '❌ ' + (data.message || 'Bet failed'));
                }
            } catch (error) {
                console.error('Bet error:', error);
                showMessage(messageDiv, 'error', ' Network error. Please try again.');
            }
        }

        function showMessage(element, type, text) {
            const msgDiv = document.getElementById(element);
            if (msgDiv) {
                msgDiv.className = `message ${type}`;
                msgDiv.innerText = text;
                msgDiv.style.display = 'block';
                
                // Auto-hide after 5 seconds
                setTimeout(() => {
                    msgDiv.style.display = 'none';
                }, 5000);
            } else {
                alert(text);
            }
        }

        function updateBalance() {
            const balanceElement = document.getElementById('balanceAmount');
            if (balanceElement) {
                balanceElement.textContent = userPoints.toLocaleString() + ' Points';
            }
        }

        // ========== Page Load ==========
        document.addEventListener('DOMContentLoaded', () => {
            initializeUserInterface();
            loadFights();
        });
        // ================================
    </script>
</body>
</html>
