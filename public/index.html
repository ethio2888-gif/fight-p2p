<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fight P2P - Premium Boxing Betting</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at 50% 0%, #1e1e30 0%, #0a0a12 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 15px;
            line-height: 1.6;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        .user-bar {
            padding: 16px 20px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #e94560;
            flex-wrap: wrap;
            gap: 10px;
        }
        .user-info { font-size: 1em; font-weight: 600; color: #ffffff; }
        .user-info span { color: #4ecca3; font-weight: 700; }
        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85em;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn-login { background: linear-gradient(135deg, #4ecca3 0%, #3fa890 100%); color: #0a0a12; }
        .btn-logout { background: rgba(233, 69, 96, 0.15); color: #e94560; border: 1px solid rgba(233, 69, 96, 0.3); }
        .btn-logout:hover { background: #e94560; color: white; }

        header { text-align: center; padding: 20px 0 30px; }
        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.5em;
            font-weight: 900;
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }
        .tagline { color: #888; font-size: 1em; }

        .user-balance {
            text-align: center;
            padding: 25px;
            margin-bottom: 25px;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.08) 0%, rgba(255, 140, 0, 0.02) 100%);
            border: 1px solid rgba(255, 215, 0, 0.15);
        }
        .user-balance > div:first-child { font-size: 0.8em; text-transform: uppercase; letter-spacing: 2px; color: #ffd700; margin-bottom: 8px; font-weight: 600; }
        .balance-amount { font-family: 'Montserrat', sans-serif; font-size: 2.5em; font-weight: 800; color: #ffffff; }

        .daily-bonus-container {
            text-align: center;
            margin-bottom: 25px;
            padding: 20px;
            background: rgba(255, 215, 0, 0.03);
            border: 1px dashed rgba(255, 215, 0, 0.3);
            border-radius: 16px;
        }
        .bonus-btn {
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
            color: #0a0a12;
            font-size: 1em;
            padding: 12px 28px;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            font-family: 'Montserrat', sans-serif;
        }
        .bonus-btn:disabled { background: #1a1a25; color: #555; border: 1px solid #333; cursor: not-allowed; }

        .ads-container { margin-bottom: 30px; display: flex; flex-direction: column; gap: 15px; align-items: center; }
        .ad-banner {
            width: 100%; max-width: 728px; min-height: 90px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; position: relative;
            text-decoration: none;
        }
        .ad-banner img { max-width: 100%; max-height: 100px; object-fit: contain; }
        .ad-label {
            position: absolute; top: 8px; right: 10px;
            font-size: 0.65em; color: #888; background: rgba(0,0,0,0.6);
            padding: 3px 8px; border-radius: 4px; text-transform: uppercase;
        }

        .fights-section { margin-bottom: 40px; }
        .section-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.4em; font-weight: 800; color: #ffffff;
            margin-bottom: 20px; padding-left: 15px;
            border-left: 4px solid #e94560;
        }

        .fight-card {
            padding: 25px 20px;
            margin-bottom: 25px;
        }
        .fight-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .fight-date { background: rgba(255, 255, 255, 0.05); color: #ccc; padding: 6px 14px; border-radius: 20px; font-weight: 600; font-size: 0.8em; }
        .status-upcoming { color: #4ecca3; font-weight: 700; font-size: 0.8em; }
        .status-live { color: #e94560; font-weight: 800; animation: pulse 1.5s infinite; font-size: 0.8em; }

        .matchup-container {
            display: flex !important;
            flex-direction: row !important;
            align-items: center !important;
            justify-content: space-between !important;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            padding: 20px 10px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .fighter { 
            flex: 1 !important; 
            text-align: center !important; 
            padding: 5px !important;
        }
        .fighter-photo { font-size: 3em; margin-bottom: 8px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4)); }
        .fighter-name { font-family: 'Montserrat', sans-serif; font-size: 1.1em; font-weight: 800; color: #ffffff; margin-bottom: 4px; }
        .fighter-record { color: #888; font-size: 0.8em; font-weight: 500; background: rgba(255,255,255,0.05); display: inline-block; padding: 3px 10px; border-radius: 20px; }
        
        .vs-badge { 
            font-family: 'Montserrat', sans-serif;
            font-size: 1.2em !important; 
            font-weight: 900 !important; 
            color: #e94560 !important; 
            background: rgba(233, 69, 96, 0.1);
            border: 1px solid rgba(233, 69, 96, 0.3);
            padding: 8px 16px !important;
            border-radius: 50px;
            margin: 0 10px !important;
            flex-shrink: 0 !important;
        }

        .betting-section {
            background: rgba(255, 255, 255, 0.02);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .bet-amount-selector { text-align: center; margin-bottom: 20px; }
        .bet-amount-selector label { color: #ffd700; font-weight: 600; display: block; margin-bottom: 12px; font-size: 0.85em; }
        
        .quick-bet-grid { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; }
        .quick-bet-btn {
            background: rgba(255, 255, 255, 0.05);
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9em;
            transition: all 0.2s;
        }
        .quick-bet-btn:hover, .quick-bet-btn.active { background: rgba(255, 215, 0, 0.15); color: #ffd700; border-color: #ffd700; }

        .custom-bet-input {
            width: 100%; max-width: 280px;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            text-align: center;
            font-size: 1.1em;
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
        }
        .custom-bet-input:focus { outline: none; border-color: #ffd700; }

        .bet-buttons { display: flex; gap: 12px; justify-content: center; margin-top: 20px; }
        .bet-btn {
            flex: 1; 
            padding: 16px 15px;
            border: none; border-radius: 12px;
            font-size: 0.95em; font-weight: 800;
            cursor: pointer; transition: all 0.3s;
            text-transform: uppercase; 
            font-family: 'Montserrat', sans-serif;
        }
        .bet-btn-fighter1 { background: linear-gradient(135deg, #e94560 0%, #c73650 100%); color: white; }
        .bet-btn-fighter2 { background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%); color: #0a0a12; }
        .bet-btn:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.1); }
        .bet-btn:disabled { background: #1a1a25; color: #444; cursor: not-allowed; transform: none; border: 1px solid #333; }

        .current-bets { margin-top: 20px; padding: 12px; background: rgba(0, 0, 0, 0.2); border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.03); }
        .bet-item { padding: 8px 12px; margin: 6px 0; background: rgba(255, 255, 255, 0.03); border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85em; border-left: 3px solid #4ecca3; }

        .message {
            margin-top: 15px; padding: 12px; border-radius: 10px;
            display: none; text-align: center; font-weight: 600; font-size: 0.9em;
        }
        .message.success { background-color: rgba(78, 204, 163, 0.1); color: #4ecca3; border: 1px solid rgba(78, 204, 163, 0.2); }
        .message.error { background-color: rgba(233, 69, 96, 0.1); color: #e94560; border: 1px solid rgba(233, 69, 96, 0.2); }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        footer { text-align: center; padding: 30px 20px; border-top: 1px solid rgba(255, 255, 255, 0.05); margin-top: 30px; color: #555; font-size: 0.8em; }

        @media (max-width: 600px) {
            h1 { font-size: 2em; }
            .fighter-photo { font-size: 2.5em; }
            .fighter-name { font-size: 0.95em; }
            .vs-badge { font-size: 1em !important; padding: 6px 12px !important; margin: 0 5px !important; }
            .bet-buttons { flex-direction: column; }
            .user-bar { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="user-bar glass-panel" id="userBar">
            <div class="user-info" id="userInfo"></div>
            <div id="authButtons"></div>
        </div>

        <header>
            <h1>🥊 Fight P2P</h1>
            <p class="tagline">Premium Peer-to-Peer Boxing Betting Arena</p>
        </header>

        <div class="user-balance glass-panel">
            <div>Your Balance</div>
            <div class="balance-amount" id="balanceAmount">1,000 Points</div>
        </div>

        <div id="daily-bonus-container" class="daily-bonus-container" style="display: none;">
            <button id="claimBonusBtn" class="btn bonus-btn">🎁 Claim Daily Bonus (+50 Points)</button>
            <p id="bonusMessage" style="margin-top: 12px; color: #888; font-size: 0.9em;"></p>
        </div>

        <div id="ads-container" class="ads-container"></div>

        <div class="fights-section">
            <h2 class="section-title">🔥 Upcoming Fights</h2>
            <div id="fights-container"></div>
        </div>

        <footer>
            <p>© 2026 Fight P2P - Bet Responsibly</p>
            <p style="margin-top: 8px; opacity: 0.7;">Virtual Points System - No Real Money</p>
        </footer>
    </div>

    <script>
        let userPoints = parseInt(localStorage.getItem('balance')) || 1000;
        const token = localStorage.getItem('token');
        const username = localStorage.getItem('username');

        function initializeUserInterface() {
            const userInfoDiv = document.getElementById('userInfo');
            const authButtonsDiv = document.getElementById('authButtons');
            if (token && username) {
                userInfoDiv.innerHTML = `Welcome, <span>${username}</span>!`;
                authButtonsDiv.innerHTML = `
                    <a href="/history.html" class="btn" style="margin-right: 8px; background: rgba(0, 191, 255, 0.15); color: #00bfff; border: 1px solid rgba(0, 191, 255, 0.3);">📜 History</a>
                    <a href="/leaderboard.html" class="btn" style="margin-right: 8px; background: rgba(255, 215, 0, 0.15); color: #ffd700; border: 1px solid rgba(255, 215, 0, 0.3);">🏆 Leaderboard</a>
                    <a href="/bets.html" class="btn" style="margin-right: 8px; background: rgba(78, 204, 163, 0.15); color: #4ecca3; border: 1px solid rgba(78, 204, 163, 0.3);">ክፍት ውርርዶች</a>
                    <button class="btn btn-logout" onclick="logout()">Logout</button>
                `;
                updateBalance();
                checkDailyBonusStatus();
            } else {
                userInfoDiv.innerHTML = `Welcome, Guest!`;
                authButtonsDiv.innerHTML = `<a href="/login.html" class="btn btn-login">Login / Register</a>`;
                disableAllBetButtons();
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('username');
            localStorage.removeItem('balance');
            window.location.reload();
        }

        function disableAllBetButtons() {
            document.querySelectorAll('.bet-btn').forEach(btn => {
                btn.disabled = true;
                if (!btn.innerHTML.includes('LOGIN')) {
                    btn.dataset.originalText = btn.innerHTML;
                    btn.innerHTML = 'LOGIN TO BET';
                }
            });
        }

        async function checkDailyBonusStatus() {
            if (!token) return;
            try {
                const response = await fetch('https://fight-p2p.onrender.com/api/daily-bonus/status', { headers: { 'Authorization': `Bearer ${token}` } });
                if (response.ok) {
                    const data = await response.json();
                    const container = document.getElementById('daily-bonus-container');
                    const btn = document.getElementById('claimBonusBtn');
                    const msg = document.getElementById('bonusMessage');
                    container.style.display = 'block';
                    if (data.isReady) {
                        btn.disabled = false;
                        btn.innerText = '🎁 Claim Daily Bonus (+50 Points)';
                        msg.innerText = '';
                    } else {
                        btn.disabled = true;
                        btn.innerText = '🎁 Bonus Claimed';
                        msg.innerText = `Next bonus in ${data.hoursLeft}h`;
                    }
                }
            } catch (error) { console.error('Bonus error:', error); }
        }

        // ✅ የተስተካከለው loadFights Function
        async function loadFights() {
            const container = document.getElementById('fights-container');
            container.innerHTML = '<p style="text-align:center; color:#888; padding:20px;">⏳ Loading fights from database...</p>';
            try {
                const response = await fetch('/api/fights');
                if (!response.ok) {
                    throw new Error(`Server returned ${response.status}`);
                }
                const fights = await response.json();
                
                if (Array.isArray(fights) && fights.length > 0) {
                    displayFights(fights);
                } else {
                    container.innerHTML = '<p style="text-align:center; color:#888; padding:20px;">No upcoming fights at the moment. Check back soon!</p>';
                }
            } catch (error) {
                console.error('Error loading fights:', error);
                container.innerHTML = `<p style="text-align:center; color:#e94560; padding:20px;">⚠️ Failed to load fights. (Error: ${error.message})<br><small>Check console (F12) for details.</small></p>`;
            }
        }

        function displayFights(fights) {
            const container = document.getElementById('fights-container');
            container.innerHTML = '';
            fights.forEach(fight => {
                const card = createFightCard(fight);
                container.appendChild(card);
                setupBetButtons(card, fight);
            });
            if (!token || !username) disableAllBetButtons();
        }

        function setupBetButtons(card, fight) {
            const quickButtons = card.querySelectorAll('.quick-bet-btn');
            const input = card.querySelector('.custom-bet-input');
            const betBtn1 = card.querySelector('.bet-btn-fighter1');
            const betBtn2 = card.querySelector('.bet-btn-fighter2');
            const msgDiv = card.querySelector('.message');

            quickButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    quickButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    input.value = btn.dataset.amount;
                });
            });

            betBtn1.addEventListener('click', () => placeBet(fight.fighter1.name, 'red', fight.id, msgDiv));
            betBtn2.addEventListener('click', () => placeBet(fight.fighter2.name, 'blue', fight.id, msgDiv));
        }

        function createFightCard(fight) {
            const card = document.createElement('div');
            card.className = 'fight-card glass-panel';
            const statusClass = fight.status === 'live' ? 'status-live' : 'status-upcoming';
            const statusText = fight.status === 'live' ? '🔴 LIVE' : '📅 UPCOMING';

            card.innerHTML = `
                <div class="fight-header">
                    <span class="${statusClass}">${statusText}</span>
                    <span class="fight-date">${new Date(fight.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</span>
                </div>
                <div class="matchup-container">
                    <div class="fighter">
                        <div class="fighter-photo">${fight.fighter1.photo}</div>
                        <div class="fighter-name">${fight.fighter1.name}</div>
                        <div class="fighter-record">${fight.fighter1.record}</div>
                    </div>
                    <div class="vs-badge">VS</div>
                    <div class="fighter">
                        <div class="fighter-photo">${fight.fighter2.photo}</div>
                        <div class="fighter-name">${fight.fighter2.name}</div>
                        <div class="fighter-record">${fight.fighter2.record}</div>
                    </div>
                </div>
                <div class="betting-section">
                    <div class="bet-amount-selector">
                        <label>Select Bet Amount (Min: 50, Max: 10,000)</label>
                        <div class="quick-bet-grid">
                            <button class="quick-bet-btn" data-amount="50">50</button>
                            <button class="quick-bet-btn" data-amount="100">100</button>
                            <button class="quick-bet-btn" data-amount="200">200</button>
                            <button class="quick-bet-btn" data-amount="500">500</button>
                            <button class="quick-bet-btn" data-amount="1000">1000</button>
                        </div>
                        <input type="number" class="custom-bet-input" placeholder="Custom amount" min="50" max="10000" value="100">
                    </div>
                    <div class="bet-buttons">
                        <button class="bet-btn bet-btn-fighter1">Bet on ${fight.fighter1.name}</button>
                        <button class="bet-btn bet-btn-fighter2">Bet on ${fight.fighter2.name}</button>
                    </div>
                    <div class="message"></div>
                    ${fight.bets && fight.bets.length > 0 ? `
                        <div class="current-bets">
                            <strong style="color:#888; font-size:0.75em; display:block; margin-bottom:8px; text-transform:uppercase;">Current Bets:</strong>
                            ${fight.bets.map(bet => `<div class="bet-item"><span>${bet.fighter}</span><span style="color:#ffd700; font-weight:700;">${bet.amount} pts</span></div>`).join('')}
                        </div>
                    ` : ''}
                </div>
            `;
            return card;
        }

        async function placeBet(fighterName, fighterChoice, fightId, messageDiv) {
            if (!token || !username) {
                alert('Please login first!');
                window.location.href = '/login.html';
                return;
            }
            const card = messageDiv.closest('.fight-card');
            const betAmount = parseInt(card.querySelector('.custom-bet-input').value);

            if (isNaN(betAmount) || betAmount < 50) { showMessage(messageDiv, 'error', '❌ Minimum bet is 50 points!'); return; }
            if (betAmount > 10000) { showMessage(messageDiv, 'error', '❌ Maximum bet is 10,000 points!'); return; }
            if (userPoints < betAmount) { showMessage(messageDiv, 'error', '❌ Insufficient points!'); return; }

            showMessage(messageDiv, 'success', `⏳ Processing ${betAmount} points...`);

            try {
                const response = await fetch('https://fight-p2p.onrender.com/api/bets/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ fighterChoice, amount: betAmount })
                });
                const data = await response.json();
                if (response.ok) {
                    userPoints = data.newBalance || (userPoints - betAmount);
                    localStorage.setItem('balance', userPoints);
                    updateBalance();
                    showMessage(messageDiv, 'success', `✅ Bet placed on ${fighterName}!`);
                    setTimeout(() => window.location.reload(), 1500);
                } else {
                    showMessage(messageDiv, 'error', '❌ ' + (data.message || 'Bet failed'));
                }
            } catch (error) {
                showMessage(messageDiv, 'error', '❌ Network error.');
            }
        }

        function showMessage(element, type, text) {
            element.className = `message ${type}`;
            element.innerText = text;
            element.style.display = 'block';
            setTimeout(() => { element.style.display = 'none'; }, 4000);
        }

        function updateBalance() {
            const el = document.getElementById('balanceAmount');
            if (el) el.textContent = userPoints.toLocaleString() + ' Points';
        }

        async function loadAds() {
            try {
                const response = await fetch('https://fight-p2p.onrender.com/api/ads');
                const ads = await response.json();
                const container = document.getElementById('ads-container');
                if (!ads || ads.length === 0) { container.style.display = 'none'; return; }
                container.innerHTML = '';
                ads.forEach(ad => {
                    const link = document.createElement('a');
                    link.className = 'ad-banner';
                    link.href = ad.targetUrl;
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';
                    link.innerHTML = `<span class="ad-label">Ad</span><img src="${ad.imageUrl}" alt="${ad.title}">`;
                    container.appendChild(link);
                });
            } catch (error) { console.error('Ad error:', error); }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initializeUserInterface();
            loadFights();
            loadAds();
            const claimBtn = document.getElementById('claimBonusBtn');
            if (claimBtn) {
                claimBtn.addEventListener('click', async () => {
                    claimBtn.disabled = true;
                    claimBtn.innerText = '⏳ Processing...';
                    try {
                        const response = await fetch('https://fight-p2p.onrender.com/api/daily-bonus/claim', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }
                        });
                        const data = await response.json();
                        if (response.ok) {
                            userPoints = data.newBalance;
                            localStorage.setItem('balance', userPoints);
                            updateBalance();
                            claimBtn.innerText = '🎁 Bonus Claimed';
                            document.getElementById('bonusMessage').innerText = `✅ ${data.message}`;
                            document.getElementById('bonusMessage').style.color = '#4ecca3';
                            setTimeout(() => window.location.reload(), 1500);
                        } else {
                            claimBtn.disabled = false;
                            claimBtn.innerText = '🎁 Claim Daily Bonus (+50 Points)';
                            document.getElementById('bonusMessage').innerText = `❌ ${data.message}`;
                            document.getElementById('bonusMessage').style.color = '#e94560';
                        }
                    } catch (error) {
                        claimBtn.disabled = false;
                        claimBtn.innerText = '🎁 Claim Daily Bonus (+50 Points)';
                        document.getElementById('bonusMessage').innerText = '❌ Network error.';
                    }
                });
            }
        });
    </script>
</body>
</html>
