<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Fight P2P</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: radial-gradient(circle at 50% 0%, #1e1e30 0%, #0a0a12 100%); color: #e0e0e0; min-height: 100vh; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .glass-panel { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 20px; padding: 25px; margin-bottom: 25px; }
        h1 { font-family: 'Montserrat', sans-serif; font-size: 2em; background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px; text-align: center; }
        .nav-link { display: inline-block; margin-bottom: 20px; color: #4ecca3; text-decoration: none; font-weight: 600; }
        .nav-link:hover { text-decoration: underline; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; color: #ffd700; font-weight: 600; font-size: 0.9em; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(255, 215, 0, 0.2); background: rgba(0, 0, 0, 0.3); color: #fff; font-size: 1em; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #ffd700; }
        .form-group input[type="file"] { padding: 10px; cursor: pointer; font-size: 0.9em; }
        .form-group input[type="file"]::file-selector-button { background: rgba(255, 215, 0, 0.15); color: #ffd700; border: 1px solid rgba(255, 215, 0, 0.3); border-radius: 6px; padding: 6px 12px; margin-right: 10px; cursor: pointer; font-weight: 600; transition: all 0.2s; }
        .form-group input[type="file"]::file-selector-button:hover { background: rgba(255, 215, 0, 0.25); }
        .row { display: flex; gap: 15px; }
        .col { flex: 1; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-weight: 700; font-size: 1em; cursor: pointer; transition: all 0.3s; font-family: 'Montserrat', sans-serif; }
        .btn-primary { background: linear-gradient(135deg, #4ecca3 0%, #3fa890 100%); color: #0a0a12; }
        .btn-primary:hover { filter: brightness(1.1); transform: translateY(-2px); }
        .btn-primary:disabled { background: #1a1a25; color: #555; cursor: not-allowed; transform: none; }
        .btn-danger { background: rgba(233, 69, 96, 0.2); color: #e94560; border: 1px solid rgba(233, 69, 96, 0.3); padding: 8px 16px; font-size: 0.85em; width: auto; }
        .btn-danger:hover { background: #e94560; color: white; }
        .btn-warning { background: rgba(255, 215, 0, 0.2); color: #ffd700; border: 1px solid rgba(255, 215, 0, 0.3); padding: 8px 16px; font-size: 0.85em; width: auto; }
        .btn-warning:hover { background: #ffd700; color: #0a0a12; }
        .btn-success { background: rgba(78, 204, 163, 0.2); color: #4ecca3; border: 1px solid rgba(78, 204, 163, 0.3); padding: 8px 16px; font-size: 0.85em; width: auto; }
        .btn-success:hover { background: #4ecca3; color: #0a0a12; }
        .btn-logout { background: rgba(233, 69, 96, 0.15); color: #e94560; border: 1px solid rgba(233, 69, 96, 0.3); padding: 10px 20px; font-size: 0.9em; width: auto; }
        .btn-logout:hover { background: #e94560; color: white; }
        .tab-buttons { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { flex: 1; padding: 12px; background: rgba(255, 255, 255, 0.05); color: #ccc; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; cursor: pointer; font-weight: 600; font-family: 'Montserrat', sans-serif; transition: all 0.3s; min-width: 120px; }
        .tab-btn:hover, .tab-btn.active { background: rgba(255, 215, 0, 0.15); color: #ffd700; border-color: rgba(255, 215, 0, 0.3); }
        .fight-list { margin-top: 20px; }
        .fight-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255, 255, 255, 0.02); border-radius: 12px; margin-bottom: 10px; border: 1px solid rgba(255, 255, 255, 0.05); }
        .fight-info { font-weight: 600; }
        .fight-date { font-size: 0.8em; color: #888; }
        .message { padding: 12px; border-radius: 10px; margin-bottom: 15px; text-align: center; font-weight: 600; display: none; }
        .message.success { background: rgba(78, 204, 163, 0.15); color: #4ecca3; border: 1px solid rgba(78, 204, 163, 0.3); }
        .message.error { background: rgba(233, 69, 96, 0.15); color: #e94560; border: 1px solid rgba(233, 69, 96, 0.3); }
        .upload-status { font-size: 0.8em; margin-top: 5px; min-height: 1.2em; color: #888; }
        @media (max-width: 600px) {
            .row { flex-direction: column; gap: 10px; }
            .fight-item { flex-direction: column; align-items: flex-start; gap: 10px; }
            .fight-item > div:last-child { width: 100%; display: flex; gap: 8px; flex-wrap: wrap; }
            .fight-item > div:last-child .btn { flex: 1; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <a href="/" class="nav-link">← Back to Home</a>
            <button onclick="logout()" class="btn btn-logout">🚪 Logout</button>
        </div>
        <h1>🛠️ Secret Admin Dashboard</h1>
        <div id="messageBox" class="message"></div>

        <div class="tab-buttons">
            <button id="tab-fights" class="tab-btn active" onclick="showTab('fights')">🥊 Fights</button>
            <button id="tab-orgs" class="tab-btn" onclick="showTab('orgs')">🏢 Organizations</button>
            <button id="tab-ads" class="tab-btn" onclick="showTab('ads')">📢 Ads</button>
        </div>

        <!-- Fights Tab -->
        <div id="fightsTab">
            <div class="glass-panel">
                <h2 id="formTitle" style="margin-bottom: 20px; color: #fff; font-size: 1.2em;">Add New Fight</h2>
                <form id="fightForm">
                    <input type="hidden" id="existingF1Photo">
                    <input type="hidden" id="existingF2Photo">
                    <div class="row">
                        <div class="col">
                            <div class="form-group"><label>Fighter 1 Name</label><input type="text" id="f1Name" required placeholder="e.g., Ethiopian Lion"></div>
                            <div class="form-group"><label>Fighter 1 Record</label><input type="text" id="f1Record" placeholder="e.g., 15-2-0"></div>
                            <div class="form-group"><label>Fighter 1 Photo</label><input type="file" id="f1PhotoFile" accept="image/*"><p id="upload1Status" class="upload-status"></p></div>
                        </div>
                        <div class="col">
                            <div class="form-group"><label>Fighter 2 Name</label><input type="text" id="f2Name" required placeholder="e.g., African Thunder"></div>
                            <div class="form-group"><label>Fighter 2 Record</label><input type="text" id="f2Record" placeholder="e.g., 12-3-1"></div>
                            <div class="form-group"><label>Fighter 2 Photo</label><input type="file" id="f2PhotoFile" accept="image/*"><p id="upload2Status" class="upload-status"></p></div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col"><div class="form-group"><label>Date</label><input type="date" id="fightDate" required></div></div>
                        <div class="col">
                            <div class="form-group"><label>Status</label>
                                <select id="fightStatus"><option value="upcoming">Upcoming</option><option value="live">Live</option><option value="finished">Finished</option></select>
                            </div>
                        </div>
                    </div>
                    <!-- 🆕 Organization Dropdown -->
                    <div class="form-group">
                        <label>Organization</label>
                        <select id="fightOrganization" required>
                            <option value="">Select Organization</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary" id="submitBtn">➕ Add Fight</button>
                    <button type="button" id="cancelEditBtn" class="btn" style="margin-top: 10px; background: rgba(255, 255, 255, 0.1); color: #ccc; display: none;" onclick="cancelEdit()">❌ Cancel Edit</button>
                </form>
            </div>
            <div class="glass-panel">
                <h2 style="margin-bottom: 20px; color: #fff; font-size: 1.2em;">Current Fights</h2>
                <div id="fightsList" class="fight-list"><p style="text-align: center; color: #888;">Loading...</p></div>
            </div>
        </div>

        <!-- Organizations Tab -->
        <div id="orgsTab" style="display: none;">
            <div class="glass-panel">
                <h2 id="orgFormTitle" style="margin-bottom: 20px; color: #fff; font-size: 1.2em;">Add New Organization</h2>
                <form id="orgForm">
                    <input type="hidden" id="existingOrgId">
                    <input type="hidden" id="existingOrgLogo">
                    <div class="row">
                        <div class="col">
                            <div class="form-group"><label>Organization Name</label><input type="text" id="orgName" required placeholder="e.g., UFC, EFC"></div>
                            <div class="form-group"><label>Description</label><input type="text" id="orgDescription" placeholder="e.g., Ultimate Fighting Championship"></div>
                        </div>
                        <div class="col">
                            <div class="form-group"><label>Display Order</label><input type="number" id="orgDisplayOrder" value="0" placeholder="0 (Lower shows first)"></div>
                            <div class="form-group"><label>Logo Image</label><input type="file" id="orgLogoFile" accept="image/*"><p id="uploadOrgStatus" class="upload-status"></p></div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary" id="orgSubmitBtn">➕ Add Organization</button>
                    <button type="button" id="cancelOrgEditBtn" class="btn" style="margin-top: 10px; background: rgba(255, 255, 255, 0.1); color: #ccc; display: none;" onclick="cancelEditOrg()">❌ Cancel Edit</button>
                </form>
            </div>
            <div class="glass-panel">
                <h2 style="margin-bottom: 20px; color: #fff; font-size: 1.2em;">Current Organizations</h2>
                <div id="orgsList" class="fight-list"><p style="text-align: center; color: #888;">Loading...</p></div>
            </div>
        </div>

        <!-- Ads Tab -->
        <div id="adsTab" style="display: none;">
            <div class="glass-panel">
                <h2 style="margin-bottom: 20px; color: #fff; font-size: 1.2em;">Add New Advertisement</h2>
                <form id="adForm">
                    <div class="form-group"><label>Ad Title</label><input type="text" id="adTitle" required placeholder="e.g., Summer Sale"></div>
                    <div class="form-group"><label>Media Type</label><select id="adType"><option value="image">Image 🖼️</option><option value="video">Video 🎥</option></select></div>
                    <div class="form-group"><label>Media URL</label><input type="url" id="adMediaUrl" required placeholder="https://example.com/ad.jpg"></div>
                    <div class="form-group"><label>Target URL</label><input type="url" id="adTargetUrl" required placeholder="https://example.com"></div>
                    <button type="submit" class="btn btn-primary">📢 Add Ad</button>
                </form>
            </div>
            <div class="glass-panel">
                <h2 style="margin-bottom: 20px; color: #fff; font-size: 1.2em;">Current Advertisements</h2>
                <div id="adsList" class="fight-list"><p style="text-align: center; color: #888;">Loading...</p></div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) { window.location.href = '/login.html'; }

        let editingFightId = null;
        let editingOrgId = null;
        let allOrganizations = []; // 🆕 Store orgs for dropdown and rendering
        
        const messageBox = document.getElementById('messageBox');
        const fightsList = document.getElementById('fightsList');
        const orgsList = document.getElementById('orgsList');
        const adsList = document.getElementById('adsList');

        function escapeHTML(str) {
            if (str === null || str === undefined) return '';
            return String(str).replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        }

        function showMessage(text, type) {
            messageBox.innerText = text;
            messageBox.className = `message ${type}`;
            messageBox.style.display = 'block';
            setTimeout(() => { messageBox.style.display = 'none'; }, 4000);
        }

        function showTab(tabName) {
            document.getElementById('fightsTab').style.display = tabName === 'fights' ? 'block' : 'none';
            document.getElementById('orgsTab').style.display = tabName === 'orgs' ? 'block' : 'none';
            document.getElementById('adsTab').style.display = tabName === 'ads' ? 'block' : 'none';
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');
            
            if (tabName === 'fights') {
                loadOrganizationsForDropdown(); // 🆕 Load orgs for the dropdown
                loadFights();
            }
            if (tabName === 'orgs') loadOrganizations();
            if (tabName === 'ads') loadAds();
        }

        // 🆕 Load organizations to populate the fight dropdown
        async function loadOrganizationsForDropdown() {
            try {
                const res = await fetch('/api/organizations', { headers: { 'Authorization': `Bearer ${token}` } });
                const result = await res.json();
                if (result.success) {
                    allOrganizations = result.data;
                    const select = document.getElementById('fightOrganization');
                    select.innerHTML = '<option value="">Select Organization</option>';
                    allOrganizations.forEach(org => {
                        const option = document.createElement('option');
                        option.value = org._id;
                        option.textContent = org.name;
                        select.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('Failed to load organizations for dropdown', error);
            }
        }

        async function uploadImage(fileInputId, statusId) {
            const fileInput = document.getElementById(fileInputId);
            const statusEl = document.getElementById(statusId);
            if (!fileInput.files || fileInput.files.length === 0) return null;
            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('image', file);
            statusEl.innerText = '⏳ Uploading...';
            statusEl.style.color = '#ffd700';
            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });
                const data = await response.json();
                if (response.ok) {
                    statusEl.innerText = '✅ Uploaded!';
                    statusEl.style.color = '#4ecca3';
                    return data.url;
                } else {
                    statusEl.innerText = '❌ Failed: ' + data.message;
                    statusEl.style.color = '#e94560';
                    return null;
                }
            } catch (error) {
                statusEl.innerText = '❌ Network error';
                statusEl.style.color = '#e94560';
                return null;
            }
        }

        // ==========================================
        // 🥊 FIGHTS LOGIC
        // ==========================================
        async function loadFights() {
            try {
                const res = await fetch('/api/fights', { headers: { 'Authorization': `Bearer ${token}` } });
                if (res.status === 403) {
                    fightsList.innerHTML = '<p style="text-align:center; color:#e94560;">Admin access required.</p>';
                    return;
                }
                const fights = await res.json();
                renderFights(fights);
            } catch (error) {
                showMessage('❌ Failed to load fights.', 'error');
            }
        }

        function renderFights(fights) {
            if (fights.length === 0) {
                fightsList.innerHTML = '<p style="text-align: center; color: #888;">No fights found.</p>';
                return;
            }
            fightsList.innerHTML = fights.map(fight => {
                // 🆕 Find organization name for display
                const org = allOrganizations.find(o => o._id === fight.organization);
                const orgName = org ? ` • 🏢 ${escapeHTML(org.name)}` : '';
                
                return `
                    <div class="fight-item">
                        <div class="fight-info">
                            ${escapeHTML(fight.fighter1.name)} 🆚 ${escapeHTML(fight.fighter2.name)}
                            <div class="fight-date">${new Date(fight.date).toLocaleDateString()} • ${escapeHTML(fight.status).toUpperCase()}${orgName}</div>
                        </div>
                        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                            ${fight.status === 'finished' || fight.status === 'live' ? 
                                `<button class="btn btn-success" onclick="declareWinner('${escapeHTML(fight._id)}', '${escapeHTML(fight.fighter1.name)}', '${escapeHTML(fight.fighter2.name)}')">🏆 Winner</button>` : ''}
                            <button class="btn btn-warning" onclick="editFight('${escapeHTML(fight._id)}', '${escapeHTML(fight.fighter1.name)}', '${escapeHTML(fight.fighter2.name)}', '${escapeHTML(fight.fighter1.record)}', '${escapeHTML(fight.fighter2.record)}', '${escapeHTML(fight.fighter1.photo)}', '${escapeHTML(fight.fighter2.photo)}', '${escapeHTML(fight.date)}', '${escapeHTML(fight.status)}', '${fight.organization || ''}')">✏️ Edit</button>
                            <button class="btn btn-danger" onclick="deleteFight('${escapeHTML(fight._id)}')">🗑️ Delete</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function editFight(id, f1Name, f2Name, f1Record, f2Record, f1Photo, f2Photo, date, status, orgId) {
            editingFightId = id;
            document.getElementById('f1Name').value = f1Name;
            document.getElementById('f2Name').value = f2Name;
            document.getElementById('f1Record').value = f1Record;
            document.getElementById('f2Record').value = f2Record;
            document.getElementById('fightDate').value = date.split('T')[0];
            document.getElementById('fightStatus').value = status;
            document.getElementById('fightOrganization').value = orgId || ''; // 🆕 Set organization
            document.getElementById('existingF1Photo').value = f1Photo;
            document.getElementById('existingF2Photo').value = f2Photo;
            document.getElementById('upload1Status').innerText = '💡 Current photo kept if empty.';
            document.getElementById('upload2Status').innerText = '💡 Current photo kept if empty.';
            document.getElementById('formTitle').innerText = '✏️ Edit Fight';
            document.getElementById('submitBtn').innerText = '💾 Update Fight';
            document.getElementById('cancelEditBtn').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelEdit() {
            editingFightId = null;
            document.getElementById('fightForm').reset();
            document.getElementById('formTitle').innerText = 'Add New Fight';
            document.getElementById('submitBtn').innerText = '➕ Add Fight';
            document.getElementById('cancelEditBtn').style.display = 'none';
            document.getElementById('upload1Status').innerText = '';
            document.getElementById('upload2Status').innerText = '';
        }

        document.getElementById('fightForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const originalBtnText = submitBtn.innerText;
            submitBtn.innerText = '⏳ Processing...';
            submitBtn.disabled = true;

            const f1PhotoUrl = await uploadImage('f1PhotoFile', 'upload1Status');
            const f2PhotoUrl = await uploadImage('f2PhotoFile', 'upload2Status');
            const existingF1Photo = document.getElementById('existingF1Photo').value || '🥊';
            const existingF2Photo = document.getElementById('existingF2Photo').value || '🥊';

            const fightData = {
                organization: document.getElementById('fightOrganization').value || null, // 🆕 Include organization ID
                fighter1: { name: document.getElementById('f1Name').value, record: document.getElementById('f1Record').value || '0-0-0', photo: f1PhotoUrl || existingF1Photo },
                fighter2: { name: document.getElementById('f2Name').value, record: document.getElementById('f2Record').value || '0-0-0', photo: f2PhotoUrl || existingF2Photo },
                date: document.getElementById('fightDate').value,
                status: document.getElementById('fightStatus').value
            };

            try {
                const url = editingFightId ? `/api/fights/${editingFightId}` : '/api/fights';
                const method = editingFightId ? 'PUT' : 'POST';
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(fightData)
                });
                const data = await res.json();
                if (res.ok) {
                    showMessage(editingFightId ? '✅ Fight updated!' : '✅ Fight added!', 'success');
                    document.getElementById('fightForm').reset();
                    cancelEdit();
                    loadFights();
                } else {
                    showMessage('❌ ' + (data.message || 'Failed'), 'error');
                }
            } catch (error) {
                showMessage('❌ Network error.', 'error');
            } finally {
                submitBtn.innerText = originalBtnText;
                submitBtn.disabled = false;
            }
        });

        async function declareWinner(fightId, f1Name, f2Name) {
            const winner = prompt(`Who won the fight?\n1. ${f1Name}\n2. ${f2Name}\n\nEnter 1 or 2:`);
            if (!winner || (winner !== '1' && winner !== '2')) {
                showMessage('❌ Invalid selection. Must be 1 or 2.', 'error');
                return;
            }
            const winnerName = winner === '1' ? f1Name : f2Name;
            const winnerKey = winner === '1' ? 'red' : 'blue';

            try {
                const res = await fetch(`/api/fights/${fightId}/declare-winner`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ winner: winnerKey, winnerName: winnerName })
                });
                const data = await res.json();
                if (res.ok) {
                    showMessage(`🏆 Winner: ${winnerName}! Payouts auto-processed.`, 'success');
                    loadFights();
                } else {
                    showMessage('❌ ' + (data.message || 'Failed'), 'error');
                }
            } catch (error) {
                showMessage('❌ Network error.', 'error');
            }
        }

        async function deleteFight(fightId) {
            if (!confirm('Delete this fight?')) return;
            try {
                const res = await fetch(`/api/fights/${fightId}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                if (res.ok) {
                    showMessage('✅ Fight deleted!', 'success');
                    loadFights();
                } else {
                    showMessage('❌ ' + (data.message || 'Failed'), 'error');
                }
            } catch (error) {
                showMessage('❌ Network error.', 'error');
            }
        }

        // ==========================================
        // 🏢 ORGANIZATIONS LOGIC
        // ==========================================
        async function loadOrganizations() {
            try {
                const res = await fetch('/api/organizations/admin', { headers: { 'Authorization': `Bearer ${token}` } });
                if (res.status === 403) {
                    orgsList.innerHTML = '<p style="text-align:center; color:#e94560;">Admin access required.</p>';
                    return;
                }
                const result = await res.json();
                renderOrganizations(result.data || []);
            } catch (error) {
                showMessage('❌ Failed to load organizations.', 'error');
            }
        }

        function renderOrganizations(orgs) {
            if (orgs.length === 0) {
                orgsList.innerHTML = '<p style="text-align: center; color: #888;">No organizations found.</p>';
                return;
            }
            orgsList.innerHTML = orgs.map(org => `
                <div class="fight-item">
                    <div class="fight-info" style="display: flex; align-items: center; gap: 15px;">
                        ${org.logoUrl ? `<img src="${escapeHTML(org.logoUrl)}" alt="Logo" style="width: 40px; height: 40px; object-fit: contain; border-radius: 50%; background: rgba(255,255,255,0.1);">` : '🏢'}
                        <div>
                            <strong>${escapeHTML(org.name)}</strong>
                            <div class="fight-date">${escapeHTML(org.description || 'No description')} • Order: ${org.displayOrder} • ${org.isActive ? '✅ Active' : '❌ Inactive'}</div>
                        </div>
                    </div>
                    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                        <button class="btn btn-warning" onclick="editOrganization('${escapeHTML(org._id)}', '${escapeHTML(org.name)}', '${escapeHTML(org.description || '')}', '${escapeHTML(org.logoUrl || '')}', ${org.displayOrder}, ${org.isActive})">✏️ Edit</button>
                        <button class="btn btn-danger" onclick="deleteOrganization('${escapeHTML(org._id)}')">🗑️ Delete</button>
                    </div>
                </div>
            `).join('');
        }

        function editOrganization(id, name, description, logoUrl, displayOrder, isActive) {
            editingOrgId = id;
            document.getElementById('orgName').value = name;
            document.getElementById('orgDescription').value = description;
            document.getElementById('orgDisplayOrder').value = displayOrder;
            document.getElementById('existingOrgLogo').value = logoUrl;
            document.getElementById('uploadOrgStatus').innerText = '💡 Current logo kept if empty.';
            document.getElementById('orgFormTitle').innerText = '✏️ Edit Organization';
            document.getElementById('orgSubmitBtn').innerText = '💾 Update Organization';
            document.getElementById('cancelOrgEditBtn').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelEditOrg() {
            editingOrgId = null;
            document.getElementById('orgForm').reset();
            document.getElementById('orgFormTitle').innerText = 'Add New Organization';
            document.getElementById('orgSubmitBtn').innerText = '➕ Add Organization';
            document.getElementById('cancelOrgEditBtn').style.display = 'none';
            document.getElementById('uploadOrgStatus').innerText = '';
        }

        document.getElementById('orgForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('orgSubmitBtn');
            const originalBtnText = submitBtn.innerText;
            submitBtn.innerText = '⏳ Processing...';
            submitBtn.disabled = true;

            const logoUrl = await uploadImage('orgLogoFile', 'uploadOrgStatus');
            const existingLogo = document.getElementById('existingOrgLogo').value || '';

            const orgData = {
                name: document.getElementById('orgName').value,
                description: document.getElementById('orgDescription').value,
                logoUrl: logoUrl || existingLogo,
                displayOrder: parseInt(document.getElementById('orgDisplayOrder').value) || 0
            };

            try {
                const url = editingOrgId ? `/api/organizations/${editingOrgId}` : '/api/organizations';
                const method = editingOrgId ? 'PUT' : 'POST';
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(orgData)
                });
                const data = await res.json();
                if (res.ok) {
                    showMessage(editingOrgId ? '✅ Organization updated!' : '✅ Organization added!', 'success');
                    document.getElementById('orgForm').reset();
                    cancelEditOrg();
                    loadOrganizations();
                } else {
                    showMessage('❌ ' + (data.message || 'Failed'), 'error');
                }
            } catch (error) {
                showMessage('❌ Network error.', 'error');
            } finally {
                submitBtn.innerText = originalBtnText;
                submitBtn.disabled = false;
            }
        });

        async function deleteOrganization(orgId) {
            if (!confirm('Delete this organization? (Note: Cannot delete if fights are linked to it)')) return;
            try {
                const res = await fetch(`/api/organizations/${orgId}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                if (res.ok) {
                    showMessage('✅ Organization deleted!', 'success');
                    loadOrganizations();
                } else {
                    showMessage('❌ ' + (data.message || 'Failed'), 'error');
                }
            } catch (error) {
                showMessage('❌ Network error.', 'error');
            }
        }

        // ==========================================
        // 📢 ADS LOGIC
        // ==========================================
        async function loadAds() {
            try {
                const res = await fetch('/api/ads', { headers: { 'Authorization': `Bearer ${token}` } });
                const ads = await res.json();
                renderAds(ads);
            } catch (error) {
                showMessage('❌ Failed to load ads.', 'error');
            }
        }

        function renderAds(ads) {
            if (!ads || ads.length === 0) {
                adsList.innerHTML = '<p style="text-align: center; color: #888;">No ads found.</p>';
                return;
            }
            adsList.innerHTML = ads.map(ad => `
                <div class="fight-item">
                    <div class="fight-info">
                        <strong>${escapeHTML(ad.title)}</strong> <span style="font-size:0.8em; color:#888;">(${ad.type === 'video' ? '🎥 Video' : '🖼️ Image'})</span>
                        <div class="fight-date">Link: ${escapeHTML(ad.targetUrl)}</div>
                    </div>
                    <button class="btn btn-danger" onclick="deleteAd('${escapeHTML(ad._id)}')">🗑️ Delete</button>
                </div>
            `).join('');
        }

        document.getElementById('adForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const adData = {
                title: document.getElementById('adTitle').value,
                type: document.getElementById('adType').value,
                mediaUrl: document.getElementById('adMediaUrl').value,
                targetUrl: document.getElementById('adTargetUrl').value
            };
            try {
                const res = await fetch('/api/ads', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(adData)
                });
                const data = await res.json();
                if (res.ok) {
                    showMessage('✅ Ad added!', 'success');
                    document.getElementById('adForm').reset();
                    loadAds();
                } else {
                    showMessage('❌ ' + (data.message || 'Failed'), 'error');
                }
            } catch (error) {
                showMessage('❌ Network error.', 'error');
            }
        });

        async function deleteAd(adId) {
            if (!confirm('Delete this ad?')) return;
            try {
                const res = await fetch(`/api/ads/${adId}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                if (res.ok) {
                    showMessage('✅ Ad deleted!', 'success');
                    loadAds();
                } else {
                    showMessage('❌ ' + (data.message || 'Failed'), 'error');
                }
            } catch (error) {
                showMessage('❌ Network error.', 'error');
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('username');
            localStorage.removeItem('balance');
            window.location.href = '/';
        }

        // Initialize first tab
        loadOrganizationsForDropdown(); // 🆕 Load orgs on startup for the fights tab
        loadFights();
    </script>
</body>
</html>
