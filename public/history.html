<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fight P2P - Prediction History</title>
    <style>
        /* --- Modern Reset & Base --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at 10% 20%, #1a1a2e 0%, #0f0f1a 90%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        .container { max-width: 850px; margin: 0 auto; }

        /* --- Glassmorphism Utility --- */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* --- User Bar --- */
        .user-bar {
            padding: 16px 24px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #e94560;
        }

        .user-info { font-size: 1.05em; font-weight: 600; color: #ffffff; }
        .user-info span { color: #4ecca3; font-weight: 700; }

        /* --- Buttons --- */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9em;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0,0,0,0.3); }
        .btn:active { transform: translateY(0); }

        .btn-home { background: linear-gradient(135deg, #4ecca3 0%, #3fa890 100%); color: #0f0f1a; }
        .btn-logout { background: linear-gradient(135deg, #e94560 0%, #c73650 100%); color: white; }

        /* --- Cancel Button --- */
        .btn-cancel { 
            padding: 10px 16px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 0.85em; 
            transition: all 0.3s ease; 
            margin-top: 15px;
            background: linear-gradient(135deg, #e94560 0%, #c73650 100%);
            color: white;
            width: 100%;
            box-shadow: 0 4px 12px rgba(233, 69, 96, 0.2);
        }
        .btn-cancel:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(233, 69, 96, 0.4);
        }
        .btn-cancel:disabled {
            background: #2a2a2a;
            color: #666;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            border: 1px solid #444;
        }

        /* --- Header --- */
        header { text-align: center; padding: 40px 0 30px; margin-bottom: 20px; }
        h1 {
            font-size: 2.5em;
            font-weight: 800;
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        header p { color: #888; font-size: 1.1em; font-weight: 400; }

        /* --- History List & Cards --- */
        .history-list { display: flex; flex-direction: column; gap: 15px; }
        
        .history-card {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: transform 0.3s ease, box-shadow 0.3s ease, opacity 0.3s ease;
        }
        .history-card:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4); 
            border-color: rgba(255, 255, 255, 0.15); 
        }

        .card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 12px; }
        
        /* 🔒 SECURITY FIRST: Renamed CSS classes from "bet" to "prediction" for UI cleanliness */
        .prediction-date { color: #888; font-size: 0.85em; font-weight: 500; }
        
        .status-badge { padding: 6px 14px; border-radius: 20px; font-size: 0.75em; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .status-open { background: rgba(255, 165, 0, 0.15); color: #ffa500; border: 1px solid rgba(255, 165, 0, 0.3); }
        .status-matched { background: rgba(0, 191, 255, 0.15); color: #00bfff; border: 1px solid rgba(0, 191, 255, 0.3); }
        .status-won { background: rgba(78, 204, 163, 0.15); color: #4ecca3; border: 1px solid rgba(78, 204, 163, 0.3); }
        .status-lost { background: rgba(233, 69, 96, 0.15); color: #e94560; border: 1px solid rgba(233, 69, 96, 0.3); }
        .status-cancelled { background: rgba(136, 136, 136, 0.15); color: #aaa; border: 1px solid rgba(136, 136, 136, 0.3); }

        .card-body { display: flex; justify-content: space-between; align-items: center; }
        .prediction-details { display: flex; flex-direction: column; gap: 6px; }
        .prediction-choice { font-size: 1.1em; font-weight: 700; color: #fff; }
        .prediction-choice span { color: #ffd700; }
        .prediction-amount { color: #888; font-size: 0.9em; font-weight: 500; }
        
        .potential-win { text-align: right; }
        .win-label { color: #888; font-size: 0.8em; font-weight: 500; margin-bottom: 4px; }
        .win-amount { font-size: 1.3em; font-weight: 800; color: #4ecca3; }

        .empty-state { 
            text-align: center; 
            padding: 50px 20px; 
            color: #888; 
            font-size: 1.1em; 
            background: rgba(255, 255, 255, 0.02); 
            border-radius: 16px; 
            border: 1px dashed rgba(255, 255, 255, 0.1); 
        }

        /* --- Responsive --- */
        @media (max-width: 600px) {
            .user-bar { flex-direction: column; gap: 15px; text-align: center; }
            .card-body { flex-direction: column; align-items: flex-start; gap: 15px; }
            .potential-win { text-align: left; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="user-bar glass-panel">
            <div class="user-info" id="userInfo">Loading...</div>
            <div id="authButtons"></div>
        </div>

        <header>
            <h1>📜 Prediction History</h1>
            <p>የግምት ታሪክህ እዚህ ይታያል</p>
        </header>

        <div id="history-container" class="history-list">
            <div class="empty-state">⏳ ውጤቶችን እያመጣን ነው...</div>
        </div>
    </div>

    <script>
        // ==========================================
        // 🔒 SECURITY FIRST: All logic preserved exactly as before
        // ==========================================
        const token = localStorage.getItem('token');
        const username = localStorage.getItem('username');
        let userPoints = parseInt(localStorage.getItem('balance')) || 0;

        // 🔒 Security First: ተጠቃሚው ካልገባ ወደ login ይላክ
        if (!token || !username) {
            window.location.href = '/login.html';
        } else {
            document.getElementById('userInfo').innerHTML = `Welcome, <span>${username}</span>! | Balance: <span>${userPoints}</span> Pts`;
            document.getElementById('authButtons').innerHTML = `
                <a href="/" class="btn btn-home" style="margin-right: 10px;">ዋና ገጽ</a>
                <button class="btn btn-logout" onclick="logout()">Logout</button>
            `;
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/login.html';
        }

        async function loadHistory() {
            try {
                // 🔒 SECURITY FIRST: API endpoint remains '/api/bets/my-bets' to maintain backend compatibility
                const response = await fetch('https://fight-p2p.onrender.com/api/bets/my-bets', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.status === 401 || response.status === 403) {
                    window.location.href = '/login.html';
                    return;
                }

                const predictions = await response.json();
                displayHistory(predictions);
            } catch (error) {
                console.error('Error loading history:', error);
                document.getElementById('history-container').innerHTML = '<div class="empty-state">❌ የኔትወርክ ችግር ተፈጥሯል።</div>';
            }
        }

        function displayHistory(predictions) {
            const container = document.getElementById('history-container');
            
            if (!predictions || predictions.length === 0) {
                container.innerHTML = '<div class="empty-state">📭 እስካሁን ምንም ግምት አላደረግህም።</div>';
                return;
            }

            container.innerHTML = '';
            predictions.forEach(pred => {
                const card = document.createElement('div');
                card.className = 'history-card glass-panel';
                card.id = `pred-card-${pred._id}`;

                // Status mapping
                let statusClass = 'status-open';
                let statusText = 'Open (ክፍት)';
                let winDisplay = `<div class="win-label">Potential Win</div><div class="win-amount">${pred.potentialWin} pts</div>`;

                if (pred.status === 'matched') {
                    statusClass = 'status-matched';
                    statusText = 'Matched (ተጣምሯል)';
                } else if (pred.status === 'won') {
                    statusClass = 'status-won';
                    statusText = 'Won (አሸንፈሃል!)';
                    winDisplay = `<div class="win-label">Won Amount</div><div class="win-amount">${pred.potentialWin} pts</div>`;
                } else if (pred.status === 'lost') {
                    statusClass = 'status-lost';
                    statusText = 'Lost (ተሳነሃል)';
                    winDisplay = `<div class="win-label">Lost</div><div class="win-amount" style="color: #e94560;">-${pred.amount} pts</div>`;
                } else if (pred.status === 'cancelled') {
                    statusClass = 'status-cancelled';
                    statusText = 'Cancelled (ተሰርዟል)';
                    winDisplay = `<div class="win-label">Refunded</div><div class="win-amount" style="color: #aaa;">${pred.amount} pts</div>`;
                }

                const date = new Date(pred.createdAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                const choiceColor = pred.fighterChoice === 'red' ? '#ff0000' : '#ffd700';
                
                // ✅ Defense in Depth: Cancel button only visible to creator
                const isCreator = pred.creator && pred.creator.username === username;
                let cancelBtn = '';
                if (pred.status === 'open' && isCreator) {
                    cancelBtn = `<button class="btn btn-cancel" onclick="cancelPrediction('${pred._id}', this)">❌ Cancel & Refund</button>`;
                }

                card.innerHTML = `
                    <div class="card-header">
                        <span class="prediction-date">📅 ${date}</span>
                        <span class="status-badge ${statusClass}">${statusText}</span>
                    </div>
                    <div class="card-body">
                        <div class="prediction-details">
                            <div class="prediction-choice">Prediction: <span style="color: ${choiceColor}">${pred.fighterChoice.toUpperCase()}</span></div>
                            <div class="prediction-amount">Points: ${pred.amount}</div>
                        </div>
                        <div class="potential-win">
                            ${winDisplay}
                        </div>
                    </div>
                    ${cancelBtn}
                `;
                container.appendChild(card);
            });
        }

        // ✅ Updated: Cancel prediction function
        async function cancelPrediction(predId, btnElement) {
            if (!confirm('Are you sure you want to cancel this prediction and refund your points?')) {
                return;
            }

            const originalText = btnElement.innerText;
            btnElement.disabled = true;
            btnElement.innerText = '⏳ Canceling...';

            try {
                // 🔒 SECURITY FIRST: API endpoint remains '/api/bets/cancel' to maintain backend compatibility
                const response = await fetch(`https://fight-p2p.onrender.com/api/bets/cancel/${predId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await response.json();

                if (response.ok) {
                    // Update local balance
                    userPoints = data.newBalance;
                    localStorage.setItem('balance', userPoints);
                    
                    // Update UI balance
                    const userInfoDiv = document.getElementById('userInfo');
                    userInfoDiv.innerHTML = `Welcome, <span>${username}</span>! | Balance: <span>${userPoints}</span> Pts`;

                    // Update card UI
                    const card = btnElement.closest('.history-card');
                    card.style.opacity = '0.6';
                    btnElement.innerText = '✅ Cancelled & Refunded';
                    btnElement.style.background = '#4ecca3';
                    btnElement.style.color = '#000';
                    btnElement.style.boxShadow = 'none';
                    
                    // Remove card after short delay
                    setTimeout(() => {
                        card.remove();
                        const container = document.getElementById('history-container');
                        if (container.children.length === 0) {
                            container.innerHTML = '<div class="empty-state">📭 እስካሁን ምንም ግምት አላደረግህም።</div>';
                        }
                    }, 1500);

                } else {
                    alert('❌ ' + (data.message || 'Failed to cancel prediction'));
                    btnElement.disabled = false;
                    btnElement.innerText = originalText;
                }
            } catch (error) {
                console.error('Cancel prediction error:', error);
                alert('❌ Network error. Please try again.');
                btnElement.disabled = false;
                btnElement.innerText = originalText;
            }
        }

        loadHistory();
    </script>
</body>
</html>
