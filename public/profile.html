<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>የእኔ ፕሮፋይል | Fight P2P</title>
  <style>
    :root {
      --primary: #e50914;
      --bg-dark: #0f0f13;
      --glass: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text: #ffffff;
      --text-muted: #a0a0a0;
      --success: #00c853;
      --warning: #ffd600;
      --gold: #ffd700;
      --gold-dark: #ff8c00;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    body {
      background-color: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin-top: 20px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      color: var(--text);
      text-decoration: none;
      font-size: 1.5rem;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      transition: all 0.3s ease;
      margin-bottom: 20px;
    }
    .back-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateX(-4px);
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 2rem;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .profile-card {
      background: var(--glass);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .avatar {
      width: 80px;
      height: 80px;
      background: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: bold;
      margin: 0 auto 20px;
      border: 3px solid var(--glass-border);
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid var(--glass-border);
    }

    .info-row:last-child { border-bottom: none; }

    .info-label {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .info-value {
      font-weight: bold;
      font-size: 1.1rem;
    }

    .balance { color: var(--success); }
    .verified { color: var(--success); }
    .unverified { color: var(--warning); }

    /* 🆕 Daily Bonus Section Styles */
    .bonus-section {
      margin: 20px 0;
      padding: 20px;
      background: rgba(255, 215, 0, 0.05);
      border: 1px dashed rgba(255, 215, 0, 0.3);
      border-radius: 12px;
      text-align: center;
    }

    .bonus-title {
      color: var(--gold);
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .bonus-btn {
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
      color: #0a0a12;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.3s;
      width: 100%;
    }

    .bonus-btn:hover:not(:disabled) {
      filter: brightness(1.1);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 215, 0, 0.3);
    }

    .bonus-btn:disabled {
      background: #1a1a25;
      color: #555;
      cursor: not-allowed;
      transform: none;
      border: 1px solid #333;
    }

    .bonus-message {
      margin-top: 10px;
      font-size: 0.85rem;
      color: var(--text-muted);
      min-height: 1.2em;
    }

    .edit-section {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid var(--glass-border);
    }

    .input-group {
      margin-bottom: 15px;
    }

    .input-group label {
      display: block;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .input-group input {
      width: 100%;
      padding: 12px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s;
    }

    .input-group input:focus {
      border-color: var(--primary);
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 10px;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover { background: #ff1a25; }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--glass-border);
      color: var(--text-muted);
    }

    .btn-secondary:hover {
      border-color: var(--text);
      color: var(--text);
    }

    .message {
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
      font-size: 0.9rem;
    }

    .message.success { background: rgba(0, 200, 83, 0.2); color: var(--success); display: block; }
    .message.error { background: rgba(229, 9, 20, 0.2); color: var(--primary); display: block; }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="/" class="back-btn" aria-label="Back to Home">←</a>

    <div class="header">
      <h1>🥊 ፕሮፋይል</h1>
    </div>

    <div id="loading" class="loading">መረጃ እየተጫነ ነው...</div>

    <div id="profileContent" class="profile-card" style="display: none;">
      <div class="avatar" id="userAvatar">U</div>
      
      <div id="messageBox" class="message"></div>

      <div class="info-row">
        <span class="info-label">ተጠቃሚ ስም</span>
        <span class="info-value" id="displayUsername">---</span>
      </div>

      <div class="info-row">
        <span class="info-label">ቀሪ ሂሳብ</span>
        <span class="info-value balance" id="displayBalance">0 ፖይንት</span>
      </div>

      <!-- 🆕 Daily Bonus Section (Moved from Home) -->
      <div id="bonusSection" class="bonus-section" style="display: none;">
        <div class="bonus-title">🎁 የዕለት ተዕለት ሽልማት</div>
        <button id="claimBonusBtn" class="bonus-btn" onclick="claimDailyBonus()">Claim Daily Bonus (+50 Points)</button>
        <p id="bonusMessage" class="bonus-message"></p>
      </div>

      <div class="info-row">
        <span class="info-label">የማረጋገጫ ሁኔታ (KYC)</span>
        <span class="info-value" id="displayVerified">---</span>
      </div>

      <div class="info-row">
        <span class="info-label">የተቀላቀሉበት ቀን</span>
        <span class="info-value" id="displayJoined">---</span>
      </div>

      <div class="edit-section">
        <div class="input-group">
          <label for="newUsername">አዲስ ስም ያስገቡ (ቢያንስ 3 ፊደል)</label>
          <input type="text" id="newUsername" placeholder="አዲስ ስም...">
        </div>
        <button class="btn btn-primary" onclick="updateProfile()">ስም አዘምን</button>
        <button class="btn btn-secondary" onclick="logout()">ዉጣ (Logout)</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = window.location.origin; 

    document.addEventListener('DOMContentLoaded', () => {
      loadProfile();
      checkDailyBonusStatus();
    });

    async function loadProfile() {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = '/login.html';
        return;
      }

      try {
        // 🔒 Security: Token በ Authorization header ይላካል
        const response = await fetch(`${API_URL}/api/users/me`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (response.status === 401 || response.status === 403) {
          localStorage.removeItem('token');
          window.location.href = '/login.html';
          return;
        }

        const data = await response.json();
        
        if (response.ok) {
          document.getElementById('loading').style.display = 'none';
          document.getElementById('profileContent').style.display = 'block';
          
          // 🔒 Security First: XSS መከላከያ (textContent ይጠቀማል)
          document.getElementById('displayUsername').textContent = data.username;
          document.getElementById('userAvatar').textContent = data.username.charAt(0).toUpperCase();
          document.getElementById('displayBalance').textContent = `${data.balance} ፖይንት`;
          
          const verifiedEl = document.getElementById('displayVerified');
          if (data.isVerified) {
            verifiedEl.textContent = '✅ የተረጋገጠ';
            verifiedEl.className = 'info-value verified';
          } else {
            verifiedEl.textContent = '⚠️ አልተረጋገጠም';
            verifiedEl.className = 'info-value unverified';
          }

          const date = new Date(data.createdAt);
          document.getElementById('displayJoined').textContent = date.toLocaleDateString('am-ET', { year: 'numeric', month: 'long', day: 'numeric' });
        } else {
          showMessage(data.message || 'ስህተት ተፈጥሯል', 'error');
        }
      } catch (error) {
        console.error('Profile load error:', error);
        showMessage('የኔትወርክ ስህተት', 'error');
      }
    }

    // 🆕 Check Daily Bonus Status
    async function checkDailyBonusStatus() {
      const token = localStorage.getItem('token');
      if (!token) return;

      try {
        const response = await fetch('/api/daily-bonus/status', { 
          headers: { 'Authorization': `Bearer ${token}` } 
        });
        
        if (response.ok) {
          const data = await response.json();
          const section = document.getElementById('bonusSection');
          const btn = document.getElementById('claimBonusBtn');
          const msg = document.getElementById('bonusMessage');
          
          section.style.display = 'block';
          
          if (data.isReady) {
            btn.disabled = false;
            btn.textContent = '🎁 Claim Daily Bonus (+50 Points)';
            msg.textContent = '';
          } else {
            btn.disabled = true;
            btn.textContent = '🎁 Bonus Claimed';
            msg.textContent = `Next bonus in ${data.hoursLeft}h`;
          }
        }
      } catch (error) {
        console.error('Bonus status error:', error);
      }
    }

    // 🆕 Claim Daily Bonus
    async function claimDailyBonus() {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = '/login.html';
        return;
      }

      const btn = document.getElementById('claimBonusBtn');
      const msg = document.getElementById('bonusMessage');
      
      btn.disabled = true;
      btn.textContent = '⏳ Processing...';

      try {
        const response = await fetch('/api/daily-bonus/claim', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json', 
            'Authorization': `Bearer ${token}` 
          }
        });
        
        const data = await response.json();
        
        if (response.ok) {
          // 🚀 HIGH TRAFFIC: Update balance in localStorage & UI instantly
          localStorage.setItem('balance', data.newBalance);
          document.getElementById('displayBalance').textContent = `${data.newBalance} ፖይንት`;
          
          btn.textContent = '🎁 Bonus Claimed';
          msg.textContent = `✅ ${data.message || '+50 Points added!'}`;
          msg.style.color = 'var(--success)';
          
          showMessage('✅ ዕለታዊ ሽልማት ተቀብልሃል!', 'success');
          
          setTimeout(() => {
            msg.textContent = '';
            checkDailyBonusStatus();
          }, 3000);
        } else {
          btn.disabled = false;
          btn.textContent = '🎁 Claim Daily Bonus (+50 Points)';
          msg.textContent = `❌ ${data.message || 'Failed'}`;
          msg.style.color = 'var(--primary)';
        }
      } catch (error) {
        console.error('Claim bonus error:', error);
        btn.disabled = false;
        btn.textContent = '🎁 Claim Daily Bonus (+50 Points)';
        msg.textContent = '❌ Network error.';
        msg.style.color = 'var(--primary)';
      }
    }

    async function updateProfile() {
      const newUsername = document.getElementById('newUsername').value.trim();
      const token = localStorage.getItem('token');

      if (!newUsername) {
        showMessage('እባክህ አዲስ ስም አስገባ', 'error');
        return;
      }

      try {
        const response = await fetch(`${API_URL}/api/users/me`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ username: newUsername })
        });

        const data = await response.json();

        if (response.ok) {
          showMessage('ፕሮፋይል በተሳካ ሁኔታ ተዘምኗል!', 'success');
          document.getElementById('newUsername').value = '';
          localStorage.setItem('username', data.user.username);
          setTimeout(() => loadProfile(), 1000); 
        } else {
          showMessage(data.message || 'ስም ማዘመን አልተሳካም', 'error');
        }
      } catch (error) {
        console.error('Update error:', error);
        showMessage('የኔትወርክ ስህተት', 'error');
      }
    }

    function showMessage(text, type) {
      const msgBox = document.getElementById('messageBox');
      msgBox.textContent = text; // 🔒 Security: textContent ስለሆነ XSS አይፈጠርም
      msgBox.className = `message ${type}`;
      setTimeout(() => {
        msgBox.className = 'message';
        msgBox.textContent = '';
      }, 4000);
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('username');
      localStorage.removeItem('balance');
      localStorage.removeItem('isVerified');
      window.location.href = '/login.html';
    }
  </script>
</body>
</html>
